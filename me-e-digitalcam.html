<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>me.e_digitalcam · Thuê máy ảnh Đà Nẵng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FCF8EC;--bg2:#F6EDD0;--card:#FFFDF6;--ink:#2B1A12;--ink2:#6E5A4E;--line:#E3D5B0;
  --pri:#6B230A;--pri2:#4A1807;--pri-ink:#FCF8EC;--acc:#E8D296;--acc2:#F1E3B9;--acc-ink:#2E0F04;
  --ok:#2F6B40;--okbg:#E4F1E7;--warn:#8A5600;--warnbg:#FBEFD3;--err:#B3261E;--errbg:#F9E1DF;--info:#2F5F7F;--infobg:#E1EDF4;
  --photo:#F1E3B9;--star:#C98A1B;--shadow:0 12px 32px rgba(46,15,4,.13);--hole:var(--bg);
  --serif:'Lora',Georgia,'Times New Roman',serif;
  --sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42 0 0 0 0 .14 0 0 0 0 .04 0 0 0 .07 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B0D07;--bg2:#24110A;--card:#2C160D;--ink:#F4E9CC;--ink2:#C9B592;--line:#4A2A1B;
  --pri:#E8D296;--pri2:#F1E3B9;--pri-ink:#2E0F04;--acc:#5A2410;--acc2:#3A1A0F;--acc-ink:#F1E3B9;
  --ok:#7CC38F;--okbg:#1E3326;--warn:#E5B04A;--warnbg:#3A2C10;--err:#F0897F;--errbg:#3F1A17;--info:#8DBBD8;--infobg:#1B2C38;
  --photo:#3A1F13;--star:#E8D296;--shadow:0 12px 32px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --bg:#1B0D07;--bg2:#24110A;--card:#2C160D;--ink:#F4E9CC;--ink2:#C9B592;--line:#4A2A1B;
  --pri:#E8D296;--pri2:#F1E3B9;--pri-ink:#2E0F04;--acc:#5A2410;--acc2:#3A1A0F;--acc-ink:#F1E3B9;
  --ok:#7CC38F;--okbg:#1E3326;--warn:#E5B04A;--warnbg:#3A2C10;--err:#F0897F;--errbg:#3F1A17;--info:#8DBBD8;--infobg:#1B2C38;
  --photo:#3A1F13;--star:#E8D296;--shadow:0 12px 32px rgba(0,0,0,.45);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg) var(--grain);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100%}
body.lock{overflow:hidden}
h1,h2,h3,h4{font-family:var(--serif);color:var(--ink);line-height:1.2;margin:0 0 .5em;font-weight:700;text-wrap:balance}
h1{font-size:clamp(34px,5.4vw,60px);letter-spacing:-.01em}
h2{font-size:clamp(26px,3.4vw,38px)}
h3{font-size:clamp(19px,2vw,22px);font-weight:600}
p{margin:0 0 1em}
a{color:var(--pri);text-decoration-thickness:1px;text-underline-offset:3px}
img,svg{max-width:100%}
.muted{color:var(--ink2)}
.sm-t{font-size:14px}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
.sec{padding:clamp(52px,7vw,92px) 0}
.alt{background:var(--bg2);--hole:var(--bg2)}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.sec-h h2{margin:0}
.sec-h p{margin:6px 0 0;max-width:56ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;box-shadow:0 0 0 5px var(--pri)}
.skip{position:absolute;left:8px;top:-60px;background:var(--pri);color:var(--pri-ink);padding:10px 14px;border-radius:8px;z-index:100}
.skip:focus{top:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1 var(--sans);padding:0 22px;height:48px;border-radius:999px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;transition:background .15s,transform .15s,border-color .15s;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn.lg{height:56px;font-size:16px;padding:0 30px}
.btn.sm{height:38px;font-size:14px;padding:0 16px}
.btn.block{width:100%}
.btn-pri{background:var(--pri);color:var(--pri-ink)}
.btn-pri:hover{background:var(--pri2)}
.btn-acc{background:var(--acc);color:var(--acc-ink)}
.btn-acc:hover{filter:brightness(.95)}
.btn-out{background:transparent;color:var(--pri);border-color:var(--pri)}
.btn-out:hover{background:var(--acc2)}
.btn-ghost{background:transparent;color:var(--pri);padding:0 10px}
.btn-ghost:hover{background:var(--acc2)}
.btn-err{background:var(--err);color:#fff}
.btn:active{transform:translateY(1px)}
.btn[disabled],.btn.off{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn.loading{pointer-events:none;color:transparent;position:relative}
.btn.loading::after{content:"";position:absolute;width:20px;height:20px;border:2.5px solid var(--pri-ink);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:20px;height:72px}
.logo{display:flex;align-items:center;gap:10px;font:700 24px var(--serif);color:var(--ink);text-decoration:none}
.logo svg{width:34px;height:34px}
.nav{display:flex;gap:4px;margin-left:12px}
.nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:500;font-size:15px}
.nav a:hover{background:var(--acc2)}
.nav a.on{background:var(--acc);color:var(--acc-ink)}
.hdr-act{margin-left:auto;display:flex;gap:8px;align-items:center}
.ibtn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ibtn:hover{background:var(--acc2)}
.ibtn svg{width:22px;height:22px}
.burger{display:none}
@media(max-width:900px){
  .nav{position:fixed;inset:calc(env(safe-area-inset-top,0px) + 72px) 0 0 0;background:var(--bg);flex-direction:column;padding:20px 20px 40px;margin:0;transform:translateX(100%);transition:transform .25s;gap:2px;overflow:auto}
  .nav.open{transform:none}
  .nav a{font:600 20px var(--serif);padding:14px 12px;border-radius:12px}
  .burger{display:grid}
  .hdr-act .btn{display:none}
}

/* stamp (perforated edge) */
.stamp{--d:13px;padding:var(--d);filter:drop-shadow(0 10px 16px rgba(46,15,4,.16));
  background:
   radial-gradient(circle at 50% 0,var(--hole) 5px,transparent 5.5px) top/16px var(--d) repeat-x,
   radial-gradient(circle at 50% 100%,var(--hole) 5px,transparent 5.5px) bottom/16px var(--d) repeat-x,
   radial-gradient(circle at 0 50%,var(--hole) 5px,transparent 5.5px) left/var(--d) 16px repeat-y,
   radial-gradient(circle at 100% 50%,var(--hole) 5px,transparent 5.5px) right/var(--d) 16px repeat-y,
   var(--card)}
.stamp-in{border:1px solid var(--line);padding:18px;height:100%;border-radius:2px}

/* hero */
.hero{padding:clamp(36px,5vw,72px) 0 clamp(80px,9vw,120px)}
.hero-in{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(24px,5vw,64px);align-items:center}
.hero h1{margin-bottom:.4em}
.lead{font-size:clamp(17px,1.6vw,19px);max-width:52ch;color:var(--ink2)}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0 26px}
.trust{list-style:none;padding:0;margin:0;display:flex;gap:10px 22px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.trust li{display:flex;align-items:center;gap:8px}
.trust svg{width:18px;height:18px;color:var(--pri)}
.hero-art{position:relative;min-height:380px;display:grid;place-items:center}
.hero-art .big{width:min(100%,430px);transform:rotate(2deg);animation:land .9s cubic-bezier(.2,.8,.2,1) both}
.hero-art .small{position:absolute;left:-2%;bottom:-6%;width:46%;transform:rotate(-7deg);animation:land .9s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes land{from{opacity:0;transform:translateY(-26px) rotate(-6deg)}}
.tag-pill{position:absolute;right:-6px;top:8%;background:var(--pri);color:var(--pri-ink);padding:10px 16px;border-radius:14px 14px 14px 4px;font-weight:600;font-size:14px;box-shadow:var(--shadow);transform:rotate(4deg)}
.tag-pill b{font:700 22px var(--serif);display:block}
.cap{font:600 15px var(--serif);margin:10px 0 0;text-align:center}
@media(max-width:900px){.hero-in{grid-template-columns:1fr}.hero-art{min-height:300px;order:-1}.hero-art .small{width:40%}}

/* quick booking */
.quick{margin-top:-64px;position:relative;z-index:2}
.quick-in{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:20px;display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:14px;align-items:end}
@media(max-width:900px){.quick-in{grid-template-columns:1fr 1fr}.quick-in>*:first-child{grid-column:1/-1}.quick-in .btn{grid-column:1/-1}}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font:600 14px var(--sans)}
input[type=text],input[type=tel],input[type=password],input[type=search],input[type=date],select,textarea{width:100%;font:400 16px var(--sans);color:var(--ink);background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:0 14px;height:48px;transition:border-color .15s,background .15s}
textarea{height:auto;min-height:110px;padding:12px 14px;resize:vertical}
input:hover,select:hover,textarea:hover{border-color:#CDB46A}
input:focus,select:focus,textarea:focus{background:var(--card);border-color:var(--pri);outline:none;box-shadow:0 0 0 3px var(--acc)}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--err)}
.help{font-size:13px;color:var(--ink2)}
.errt{font-size:13px;color:var(--err);display:flex;gap:6px;align-items:center}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--pri);flex:none}
.chk.bad{color:var(--err)}
input[type=range]{accent-color:var(--pri);width:100%}

/* badges & chips */
.badge{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--sans);padding:4px 10px;border-radius:999px;background:var(--acc2);color:var(--ink)}
.b-ok{background:var(--okbg);color:var(--ok)}.b-low{background:var(--warnbg);color:var(--warn)}.b-out{background:var(--errbg);color:var(--err)}.b-info{background:var(--infobg);color:var(--info)}.b-pri{background:var(--pri);color:var(--pri-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;font:500 14px var(--sans);cursor:pointer}
.chip:hover{border-color:var(--pri)}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}

/* camera cards */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media(max-width:1000px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid4,.grid3{grid-template-columns:1fr}.snap{display:flex!important;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1*clamp(16px,4vw,48px));padding:4px clamp(16px,4vw,48px) 14px}.snap>*{flex:0 0 82%;scroll-snap-align:start}}
.cam{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 22px 6px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.cam:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.cam-ph{display:block;position:relative;aspect-ratio:4/3;background:radial-gradient(120% 90% at 30% 20%,var(--acc2),var(--photo));padding:14px 18px}
.cam-ph svg{width:100%;height:100%}
.cam-ph .badge{position:absolute;left:12px;top:12px}
.cam.out .cam-ph svg{filter:grayscale(.8);opacity:.6}
.like{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:color-mix(in srgb,var(--card) 85%,transparent);color:var(--pri);cursor:pointer;display:grid;place-items:center}
.like svg{width:18px;height:18px;width:18px!important;height:18px!important}
.like.on svg{fill:var(--pri)}
.cam-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:4px;flex:1}
.cam-b h3{margin:0;font-size:18px}
.cam-b p{margin:0;font-size:14px;color:var(--ink2)}
.cam-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:14px}
.price{font-size:14px;color:var(--ink2)}
.price b{font:700 22px var(--serif);color:var(--ink)}
.price small{display:block;font-size:12px}

/* package tickets */
.pk{height:100%}
.pk .stamp-in{display:flex;flex-direction:column;gap:6px;background:transparent}
.pk h3{margin:0;font-size:26px}
.pk .big{font:700 34px var(--serif);color:var(--pri);margin:6px 0 0}
.pk ul{list-style:none;margin:10px 0 18px;padding:0;font-size:14px;display:grid;gap:6px}
.pk li{display:flex;gap:8px}
.pk li svg{width:16px;height:16px;flex:none;margin-top:4px;color:var(--ok)}
.pk .btn{margin-top:auto}
.pk.best{--d:13px}
.pk.best .stamp-in{background:var(--acc2)}

/* timeline */
.tl{position:relative;display:grid;gap:26px;padding-left:64px;max-width:760px}
.tl::before{content:"";position:absolute;left:23px;top:8px;bottom:8px;border-left:2px dashed #CDB46A}
.tl-i{position:relative}
.tl-i .n{position:absolute;left:-64px;top:0;width:48px;height:48px;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font:700 20px var(--serif)}
.tl-i h3{margin:0 0 4px}
.tl-i p{margin:0 0 8px;color:var(--ink2)}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 14px;font-size:14px;background:var(--infobg);color:var(--ink)}
.note svg{width:18px;height:18px;flex:none;margin-top:3px}
.note.err{background:var(--errbg)}.note.err svg{color:var(--err)}
.note.warn{background:var(--warnbg)}.note.warn svg{color:var(--warn)}
.note.ok{background:var(--okbg)}.note.ok svg{color:var(--ok)}
.note.info svg{color:var(--info)}

/* split */
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.rows{display:grid;gap:0}
.rows>div{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.rows>div:last-child{border:0}
.rows svg{width:26px;height:26px;color:var(--pri);flex:none;margin-top:2px}
.rows h4{margin:0 0 2px;font-size:17px}
.rows p{margin:0;color:var(--ink2);font-size:15px}
.kv{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.kv li{display:flex;justify-content:space-between;gap:16px;border-bottom:1px dashed var(--line);padding-bottom:8px;font-size:15px}
.kv li b{font-weight:600;text-align:right}
.lines{margin:0;padding-left:20px;display:grid;gap:8px}

/* reviews */
.score{display:flex;gap:20px;align-items:center;margin-bottom:18px}
.score .n{font:700 64px/1 var(--serif);color:var(--pri)}
.stars{display:inline-flex;gap:2px;color:var(--star)}
.stars svg{width:18px;height:18px;fill:currentColor}
.stars .e{opacity:.28}
.bars{display:grid;gap:6px;font-size:13px}
.bars button{display:grid;grid-template-columns:28px 1fr 28px;gap:8px;align-items:center;background:none;border:0;padding:2px 0;cursor:pointer;color:var(--ink);font:inherit}
.bars i{display:block;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bars i b{display:block;height:100%;background:var(--star)}
.rv{background:var(--card);border:1px solid var(--line);border-radius:6px 22px 22px 22px;padding:20px;display:flex;flex-direction:column;gap:10px;break-inside:avoid}
.rv-h{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font:700 16px var(--serif);flex:none}
.rv-h b{display:block;line-height:1.2}
.rv-h small{color:var(--ink2)}
.rv p{margin:0}
.ph{display:flex;gap:8px}
.ph button{width:64px;height:64px;border-radius:12px;border:1px solid var(--line);background:var(--photo);padding:0;cursor:pointer;overflow:hidden}
.ph button svg,.ph button img{width:100%;height:100%;object-fit:cover}
.reply{margin-left:14px;border-left:3px solid var(--pri);background:var(--bg2);border-radius:0 12px 12px 0;padding:10px 14px;font-size:14px}
.reply b{display:block;font-size:13px;color:var(--pri)}
.helpful{align-self:flex-start;background:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font:500 13px var(--sans);color:var(--ink2);cursor:pointer}
.helpful.on{background:var(--acc2);color:var(--ink);border-color:var(--pri)}
.masonry{columns:2;column-gap:22px}
.masonry>*{margin-bottom:22px}
@media(max-width:800px){.masonry{columns:1}}
.starpick{display:flex;gap:4px}
.starpick button{background:none;border:0;padding:2px;cursor:pointer;color:var(--star)}
.starpick svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.6}
.starpick button.on svg{fill:currentColor}

/* tables / tabs */
.tbl-w{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:15px}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--acc2);font-weight:600;position:sticky;top:0}
td:first-child,th:first-child{position:sticky;left:0;background:inherit}
tbody tr:hover{background:var(--bg2)}
tbody td:first-child{background:var(--card);font-weight:600}
tbody tr:hover td:first-child{background:var(--bg2)}
td.n{font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:24px}
.tabs a,.tabs button{padding:12px 18px;border:0;background:none;color:var(--ink2);font:600 15px var(--sans);text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent;cursor:pointer}
.tabs a:hover,.tabs button:hover{color:var(--pri)}
.tabs .on{color:var(--pri);border-bottom-color:var(--pri);background:var(--acc2);border-radius:10px 10px 0 0}
details{border-bottom:1px solid var(--line)}
summary{cursor:pointer;padding:18px 4px;font:600 17px var(--serif);list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:500 24px var(--sans);color:var(--pri);line-height:1}
details[open] summary::after{content:"–"}
details p{padding:0 4px 18px;margin:0;color:var(--ink2);max-width:70ch}

/* catalog */
.cat{display:grid;grid-template-columns:260px 1fr;gap:32px;align-items:start}
.filters{position:sticky;top:96px;display:grid;gap:22px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.filters fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
.filters legend{font:600 14px var(--sans);margin-bottom:6px;padding:0}
@media(max-width:900px){.cat{grid-template-columns:1fr}.filters{position:static}}
.empty{text-align:center;padding:56px 20px;background:var(--card);border:1px dashed #CDB46A;border-radius:22px}
.empty svg{width:64px;height:64px;color:var(--pri);margin-bottom:8px}
.empty h3{margin-bottom:6px}

/* detail */
.crumb{font-size:14px;color:var(--ink2);margin-bottom:18px}
.crumb a{color:var(--ink2)}

/* ---------- calendar ---------- */
function calendar(ids,sel,p){
  const m0=new Date(today.getFullYear(),today.getMonth()+S.ui.cal,1);
  const first=(m0.getDay()+6)%7,days=new Date(m0.getFullYear(),m0.getMonth()+1,0).getDate();
  const bk=new Set();ids.forEach(id=>BOOKED[id].forEach(x=>bk.add(x)));
  const end=sel?iso(addD(pISO(sel),span(p))):'';
  let cells='';for(let i=0;i<first;i++)cells+='<span></span>';
  for(let d=1;d<=days;d++){
    const dd=new Date(m0.getFullYear(),m0.getMonth(),d),k=iso(dd),past=dd<today,b=bk.has(k);
    const cl=[b?'bk':'',k===iso(today)?'td':'',sel&&k===sel?'st':'',sel&&k>sel&&k<=end?'rg':''].join(' ');
    cells+=`<button class="day ${cl}" data-act="pickday" data-d="${k}" ${past||b?'disabled':''} aria-label="${d}/${m0.getMonth()+1}${b?', đã có người đặt':''}" ${k===sel?'aria-pressed="true"':''}>${d}</button>`;
  }
  return `<div class="cal"><div class="cal-h"><button class="ibtn" data-act="calp" aria-label="Tháng trước" ${S.ui.cal<=0?'disabled style="opacity:.3"':''}>${ic('chevl')}</button><span>Tháng ${m0.getMonth()+1}, ${m0.getFullYear()}</span><button class="ibtn" data-act="caln" aria-label="Tháng sau" ${S.ui.cal>=2?'disabled style="opacity:.3"':''}>${ic('chevr')}</button></div>
  <div class="cal-g">${['T2','T3','T4','T5','T6','T7','CN'].map(w=>`<span class="w">${w}</span>`).join('')}${cells}</div>
  <div class="legend"><span><i style="background:var(--pri)"></i>Ngày nhận</span><span><i style="background:var(--acc)"></i>Thời gian thuê</span><span><i style="background:repeating-linear-gradient(135deg,transparent 0 3px,var(--line) 3px 4px);border:1px solid var(--line)"></i>Đã có người đặt</span></div></div>`;
}
function availMsg(ids,date,p){
  if(!ids.length)return '';
  if(!date)return `<div class="note info">${ic('info')}<span>Chọn ngày nhận trên lịch để kiểm tra máy trống.</span></div>`;
  if(free(ids,date,p))return `<div class="note ok">${ic('check')}<span>Còn máy trong thời gian này.</span></div>`;
  const n=nextFree(ids,date,p);
  return `<div class="note err">${ic('alert')}<span>Đã có người đặt trong thời gian này. ${n?`Ngày gần nhất còn máy: <button class="btn-ghost btn sm" style="height:auto;padding:0 4px;text-decoration:underline" data-act="pickday" data-d="${n}">${dm(pISO(n))}</button>`:'Hãy thử ngày khác.'}</span></div>`;
}

const SHEAD=['Chọn máy','Thời gian','Thông tin & cọc','Xác nhận'];
function stepper(s){return `<ol class="steps" aria-label="Các bước đặt lịch">${SHEAD.map((t,i)=>`<li class="${i+1<s?'done':i+1===s?'cur':''}" ${i+1===s?'aria-current="step"':''}><span class="c">${i+1<s?ic('check'):i+1}</span><span>${t}</span></li>`).join('')}</ol>`}
function summary(b){
  const tm=timing(b),tot=sumP(b.cams,b.pkg);

  <ul class="kv"><li><span>Nhận</span><b>${tm?dt(tm.s):'Chưa chọn'}</b></li><li><span>Trả trước</span><b>${tm?dt(tm.e):'Chưa chọn'}</b></li><li><span>Hình thức</span><b>${b.method==='direct'?'Đến lấy tại cửa hàng':'Giao/ship'}</b></li><li><span>Tiền thuê</span><b>${vnd(tot)}</b></li><li><span>Giữ slot (trừ vào tiền thuê)</span><b>50.000đ</b></li><li><span>Cọc khi nhận</span><b>${b.cams.length?vnd(depOf(b.cams)):'-'}</b></li></ul></aside>`;

function bookStep(b){
  const e=b.err||{};const f=(k,l,ph,t='text',ex='')=>`<div class="field ${e[k]?'bad':''}"><label for="b-${k}">${l}</label><input id="b-${k}" type="${t}" data-bind="b.${k}" value="${esc(b[k])}" placeholder="${ph}" ${ex}>${e[k]?`<span class="errt" role="alert">${ic('alert')}${e[k]}</span>`:''}</div>`;
  if(b.step===1)return `<div class="panel"><div><h2 style="font-size:26px">Chọn máy</h2><p class="muted" style="margin:0">Bạn có thể chọn nhiều máy trong cùng một đơn.</p></div>
   <div style="display:grid;gap:10px">${CAMS.map(c=>{const on=b.cams.includes(c.id),out=c.st==='out';return `<button class="pick ${on?'on':''} ${out?'off':''}" data-act="bcam" data-id="${c.id}" ${out?'disabled':''} aria-pressed="${on}"><span class="th">${camSVG(c)}</span><span><b>${esc(c.name)}</b><small>${K(c.p[b.pkg])} · ${PKG[b.pkg].n}${out?' · Hết máy':''}</small></span><span class="tk">${on?ic('check'):''}</span></button>`}).join('')}</div>
   ${e.cams?`<span class="errt" role="alert">${ic('alert')}${e.cams}</span>`:''}<div class="nav-btns"><a class="btn btn-ghost" href="#/may">Xem danh mục</a><button class="btn btn-pri" data-act="bnext">Tiếp tục</button></div></div>`;
  if(b.step===2){
    const tm=timing(b);
    return `<div class="panel"><h2 style="font-size:26px">Chọn thời gian</h2>
    <div><div class="lbl" style="margin-bottom:8px">Gói thuê</div><div class="pkpick">${PKG.map((x,i)=>`<button class="${b.pkg===i?'on':''}" data-act="bpk" data-p="${i}" aria-pressed="${b.pkg===i}"><b>${x.n}</b><small>${x.sub}</small></button>`).join('')}</div></div>

    <div><div class="lbl" style="margin-bottom:8px">Hình thức nhận máy</div><div style="display:grid;gap:10px">

     <label class="radio ${b.method==='ship'?'on':''}"><input type="radio" name="bm" data-bind="b.method" data-re="1" value="ship" ${b.method==='ship'?'checked':''}><span><b>Giao hoặc ship</b><span class="muted sm-t">Cọc online, phí giao nhận tính riêng</span></span></label></div></div>

     ${b.method==='direct'?`<label class="radio ${b.dep==='direct'?'on':''}"><input type="radio" name="bd" data-bind="b.dep" data-re="1" value="direct" ${b.dep==='direct'?'checked':''}><span><b>Cọc trực tiếp khi nhận máy</b><span class="muted sm-t">${vnd(dep)} + CCCD chính chủ, hoặc cọc tài sản trên 15 triệu + CCCD</span></span></label>`:''}

    <div class="stamp"><div class="stamp-in" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg class="qr" viewBox="0 0 21 21" aria-label="Mã QR chuyển khoản mẫu">${Array.from({length:441},(_,i)=>{const x=i%21,y=(i/21)|0;const fin=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);const on=fin?(x%6===0||y%6===0||x%14===0&&0||((x<7||x>13)&&(y<7||y>13)&&(x%6===0||y%6===0||(x%6>1&&x%6<5&&y%6>1&&y%6<5)))): hash('q'+i)%3===0;return on?`<rect x="${x}" y="${y}" width="1" height="1" fill="#2B1A12"/>`:''}).join('')}</svg>
     <div style="flex:1;min-width:200px;display:grid;gap:8px"><h3 style="margin:0;font-size:18px">Thanh toán giữ slot: 50.000đ</h3><p class="muted sm-t" style="margin:0">Khoản này được trừ vào tiền thuê. Quét mã hoặc chuyển khoản theo thông tin mẫu bên dưới.</p><div class="copy"><span>Nội dung: <b>MEE ${esc(b.phone||'SĐT')}</b></span><button class="btn btn-ghost sm" data-act="copy" data-v="MEE ${esc(b.phone)}" aria-label="Sao chép nội dung chuyển khoản">${ic('copy')}</button></div></div></div></div>
    <div class="nav-btns"><button class="btn btn-out" data-act="bback">Quay lại</button><button class="btn btn-pri" data-act="bnext">Tiếp tục</button></div></div>`;
  }
  const tm=timing(b);
  return `<div class="panel"><h2 style="font-size:26px">Xác nhận đặt lịch</h2>
   <ul class="kv"><li><span>Máy</span><b>${b.cams.map(id=>esc(CAM(id).name)).join(', ')}</b></li><li><span>Gói</span><b>${PKG[b.pkg].n}</b></li><li><span>Nhận</span><b>${tm?dt(tm.s):''}</b></li><li><span>Trả trước</span><b>${tm?dt(tm.e):''}</b></li><li><span>Người thuê</span><b>${esc(b.name)} · ${esc(b.phone)}</b></li><li><span>Tiền thuê</span><b>${vnd(sumP(b.cams,b.pkg))}</b></li><li><span>Cọc</span><b>${vnd(depOf(b.cams))} (${b.method==='ship'||b.dep==='online'?'online':'trực tiếp'})</b></li></ul>
   <div style="display:grid;gap:12px"><div class="lbl">Quy định cần đồng ý</div>
    <label class="chk ${e.a1?'bad':''}"><input type="checkbox" data-bind="b.a1" ${b.a1?'checked':''}><span>Tôi đã đọc quy định <a href="#/chinh-sach/coc" target="_blank" rel="noopener">tiền cọc</a> và <a href="#/chinh-sach/nhan-tra" target="_blank" rel="noopener">nhận, trả máy</a>.</span></label>
    <label class="chk ${e.a2?'bad':''}"><input type="checkbox" data-bind="b.a2" ${b.a2?'checked':''}><span>Tôi đồng ý <a href="#/chinh-sach/den-bu" target="_blank" rel="noopener">quy định đền bù thiệt hại</a>.</span></label>
    <label class="chk ${e.a3?'bad':''}" style="background:var(--errbg);padding:12px;border-radius:12px"><input type="checkbox" data-bind="b.a3" ${b.a3?'checked':''}><span><b>Tôi hiểu cửa hàng không nhận hủy lịch trong bất kỳ trường hợp nào</b> và 50K giữ slot không hoàn lại.</span></label>
    ${(e.a1||e.a2||e.a3)?`<span class="errt" role="alert">${ic('alert')}Bạn cần đồng ý cả ba mục để tiếp tục.</span>`:''}</div>
   <div class="nav-btns"><button class="btn btn-out" data-act="bback">Quay lại</button><button class="btn btn-pri lg" data-act="bsubmit">Xác nhận đặt lịch</button></div></div>`;
}

  <div class="panel"><div class="tabs" style="margin:0"><button class="${!reg?'on':''}" data-act="regtab" data-r="0">Đăng nhập</button><button class="${reg?'on':''}" data-act="regtab" data-r="1">Đăng ký</button></div>

  <div class="field"><label for="l-ph">Số điện thoại</label><input id="l-ph" type="tel" inputmode="numeric" autocomplete="tel" placeholder="0912345678"></div>
  <div class="field"><label for="l-pw">Mật khẩu</label><input id="l-pw" type="password" autocomplete="${reg?'new-password':'current-password'}" placeholder="Ít nhất 6 ký tự"></div><div id="l-err" role="alert"></div>

const OST=['Đã giữ slot','Đã xác nhận','Đang thuê','Đã trả máy','Đã hoàn cọc'];
function side(t){return `<nav class="side" aria-label="Tài khoản"><div class="me"><span class="av">${esc(S.user.name[0])}</span><div><b>${esc(S.user.name)}</b><br><small class="muted">${esc(S.user.phone)}</small></div></div>${[['don','Đơn thuê của tôi'],['danh-gia','Đánh giá của tôi'],['ho-so','Hồ sơ và xác minh']].map(([k,v])=>`<a href="#/tai-khoan/${k}" class="${t===k?'on':''}">${v}</a>`).join('')}<button data-act="logout">Đăng xuất</button></nav>`}
function ordCard(o){
  const c=CAM(o.cams[0]),late=o.stage===2&&o.end<new Date();
  const bcl=o.stage===2?(late?'b-out':'b-pri'):o.stage>=3?'b-ok':'b-info';
  return `<article class="ord"><div class="th">${camSVG(c)}</div><div><span class="badge ${bcl}">${OST[o.stage]}</span><h3>${o.cams.map(id=>esc(CAM(id).name)).join(', ')}</h3><div class="meta">Mã ${o.id} · ${PKG[o.pkg].n}<br>${dt(o.start)} đến ${dt(o.end)}</div>
  ${o.stage===2?`<div class="cd" data-cd="${+o.end}"></div>`:''}<div class="meta">Tổng ${vnd(o.total)} · ${esc(o.dep)}</div></div>
  <div class="act" style="display:grid;gap:8px"><a class="btn btn-out sm" href="#/tai-khoan/don/${o.id}">Chi tiết</a>${o.stage===2?`<button class="btn btn-acc sm" data-act="extend" data-id="${o.id}">Gia hạn</button><button class="btn btn-pri sm" data-act="retm" data-id="${o.id}">Báo trả máy</button>`:''}${o.stage>=3&&!o.reviewed?`<button class="btn btn-pri sm" data-act="writerv" data-oid="${o.id}">Viết đánh giá</button>`:''}</div></article>`;
}
P.account=tab=>{
  if(!S.user)return P.loginReq();
  let body='';
  if(tab==='danh-gia'){
    const mine=S.reviews.filter(r=>r.mine),pend=S.orders.filter(o=>o.stage>=3&&!o.reviewed);
    body=`<h2>Đánh giá của tôi</h2>${pend.length?`<h3 style="font-size:18px">Chờ bạn đánh giá</h3><div style="display:grid;gap:14px;margin-bottom:28px">${pend.map(ordCard).join('')}</div>`:''}${mine.length?`<div class="masonry">${mine.map(r=>reviewCard(r)).join('')}</div>`:`<div class="empty">${ic('cam')}<h3>Bạn chưa viết đánh giá nào</h3><p class="muted">Sau khi trả máy, bạn có thể chia sẻ trải nghiệm của mình.</p></div>`}`;
  } else if(tab==='ho-so'){
    const v=S.user.verify||0;
    body=`<h2>Hồ sơ và xác minh</h2><div class="panel"><div class="row2"><div class="field"><label for="h-n">Họ và tên</label><input id="h-n" type="text" data-bind="user.name" value="${esc(S.user.name)}"></div><div class="field"><label for="h-p">Số điện thoại</label><input id="h-p" type="tel" data-bind="user.phone" value="${esc(S.user.phone)}"></div></div>
    <div><div class="lbl" style="margin-bottom:8px">Xác minh CCCD <span class="badge ${['b-low','b-info','b-ok'][v]}" style="margin-left:6px">${['Chưa xác minh','Đang duyệt','Đã xác minh'][v]}</span></div><label class="upl ${v?'ok':''}"><input type="file" accept="image/*" data-file="verify">${v?ic('check')+' Đã gửi ảnh CCCD':ic('upload')+'<br>Tải ảnh CCCD chính chủ'}</label><p class="help" style="margin-top:8px">Ảnh CCCD chỉ dùng để xác minh khi thuê máy.</p></div>
    <button class="btn btn-pri" data-act="saveprof" style="justify-self:start">Lưu thay đổi</button></div>`;
  } else {
    const L=S.orders,tabs=[['now','Đang diễn ra',L.filter(o=>o.stage===2)],['soon','Sắp tới',L.filter(o=>o.stage<2)],['past','Đã hoàn tất',L.filter(o=>o.stage>=3)]],cur=tabs.find(t=>t[0]===S.ui.otab)||tabs[0];
    body=`<h2>Đơn thuê của tôi</h2><div class="tabs">${tabs.map(([k,t,l])=>`<button class="${cur[0]===k?'on':''}" data-act="otab" data-t="${k}">${t} (${l.length})</button>`).join('')}</div>${cur[2].length?`<div style="display:grid;gap:14px">${cur[2].map(ordCard).join('')}</div>`:`<div class="empty">${ic('film')}<h3>Chưa có đơn nào ở mục này</h3><p class="muted">Chọn một chiếc máy và giữ lịch cho buổi chụp tiếp theo.</p><a class="btn btn-pri" href="#/may">Xem máy cho thuê</a></div>`}`;
  }
  return `<section class="sec" style="padding-top:36px"><div class="wrap acc">${side(tab)}<div>${body}</div></div></section>`;
};

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-ad]');if(!a||a.tagName==='INPUT')return;
  const k=a.dataset.ad,id=a.dataset.id,O=()=>ALL().find(o=>o.id===id),ok=m=>{closeModal(true);toast(m,'ok');refresh()};
  const checked=()=>$$('[data-adchk]',mr).every(x=>x.checked);
  switch(k){
   case'login':{const u=$('#a-u').value.trim().toLowerCase(),p=$('#a-p').value,ac=ADM.accounts.find(x=>x.user===u);
    const msg=!ac||ADM.pw[u]!==p?'Sai tài khoản hoặc mật khẩu.':!ac.on?'Tài khoản đang bị khóa.':'';
    if(msg){$('#a-err').innerHTML=`<span class="errt">${ic('alert')}${msg}</span>`;break}
    ADM.user=ac;adGo('#/quan-tri/tong-quan');break}
   case'demo':ADM.user=ADM.accounts.find(x=>x.user===a.dataset.u);adGo('#/quan-tri/tong-quan');break;
   case'logout':ADM.user=null;toast('Đã đăng xuất');adGo('#/quan-tri');break;
   case'ost':ADM.st=a.dataset.s;refresh();break;
   case'detail':detailModal(O());break;
   case'confirm':{O().stage=1;toast('Đã xác nhận giữ slot','ok');refresh();break}
   case'give':closeModal(true);giveModal(O());break;
   case'giveok':{if(!checked()){toast('Cần hoàn tất danh sách kiểm tra','err');break}const o=O(),t=$('#g-t').value;o.stage=2;o.depType=t;o.dep='Đã nhận '+t;o.depAmt=t.includes('300.000')?300:700;ok('Đã giao máy cho khách')}break;
   case'ret':closeModal(true);retModal(O());break;
   case'retok':{if(!checked()){toast('Cần hoàn tất danh sách kiểm tra','err');break}const o=O(),r=calcRet();o.stage=3;o.deduct=r.tot;ok('Đã nhận máy, chuyển sang chờ hoàn cọc')}break;
   case'refund':closeModal(true);refundModal(O());break;
   case'refundok':{const o=O(),amt=Math.max(0,mo(o).dep-(o.deduct||0));o.stage=4;o.dep=(o.depType||'').includes('Tài sản')?'Đã trả lại tài sản cọc':'Đã hoàn '+vnd(amt);ok('Đã hoàn cọc')}break;
   case'newo':newOrderModal();break;
   case'newok':{const n=$('#n-n').value.trim(),p=$('#n-p').value.replace(/\s/g,''),c=$('#n-c').value,pk=+$('#n-k').value,d=$('#n-d').value,h=+$('#n-h').value;
    if(!n||!/^0\d{9}$/.test(p)||!d){toast('Nhập đủ tên, SĐT 10 số và ngày nhận','err');break}
    if(!free([c],d,pk)){toast('Máy đã có người đặt trong thời gian này','err');break}
    const dd=pISO(d),s=new Date(dd.getFullYear(),dd.getMonth(),dd.getDate(),h),en=pk===0?new Date(s.getTime()+6*36e5):new Date(s.getTime()+(24*pk-1)*36e5);
    S.orders.unshift({id:'MEE'+(2100+Math.floor(Math.random()*800)),cust:n,phone:p,cams:[c],pkg:pk,start:s,end:en,stage:1,total:sumP([c],pk),dep:'Chờ nhận khi lấy máy',depAmt:depOf([c]),method:'direct',base:'Cs1'});
    ok('Đã tạo đơn');break}
   case'eadd':if(isOwner())eqModal();break;
   case'eedit':if(isOwner())eqModal(CAM(id));break;
   case'eok':{if(!isOwner())break;const nm=$('#e-n').value.trim(),p=PKG.map((_,i)=>+$('#e-p'+i).value),q=+$('#e-q').value;let st=$('#e-s').value;

    ok('Đã lưu thiết bị');break}
   case'sadd':svModal();break;
   case'sedit':svModal(ADM.services.find(s=>s.id===+id));break;
   case'sok':{const nm=$('#s-n').value.trim();if(!nm){toast('Nhập tên dịch vụ','err');break}
    const v={name:nm,cat:$('#s-c').value,price:$('#s-p').value.trim(),desc:$('#s-d').value.trim()};

   case'rvf':ADM.rvf=a.dataset.f;refresh();break;
   case'rsave':{const r=S.reviews.find(x=>x.id===+id);r.reply=$('#rp-'+id).value.trim();toast('Đã lưu phản hồi','ok');refresh();break}

   case'aadd':accModal();break;
   case'aok':{const nm=$('#a-nm').value.trim(),us=$('#a-us').value.trim().toLowerCase();
    if(!nm||!/^[a-z0-9_.]{3,}$/.test(us)){toast('Nhập họ tên và tên đăng nhập (từ 3 ký tự, không dấu)','err');break}
    if(ADM.accounts.some(x=>x.user===us)){toast('Tên đăng nhập đã tồn tại','err');break}

   case'areset':{const ac=ADM.accounts.find(x=>x.id===+id);ADM.pw[ac.user]='123456';toast('Đã đặt lại mật khẩu về 123456','ok');break}
   case'alock':{const ac=ADM.accounts.find(x=>x.id===+id);ac.on=!ac.on;toast(ac.on?'Đã mở khóa':'Đã khóa tài khoản');refresh();break}
  }
});

function route(){
  const p=(location.hash.slice(1).split('?')[0])||'/';let m;
  if(p==='/')return[P.home(),'me.e_digitalcam · Thuê máy ảnh Đà Nẵng'];
  if(p==='/may')return[P.catalog(),'Máy cho thuê'];
  if(m=p.match(/^\/may\/([\w-]+)$/)){const c=CAM(m[1]);return[P.detail(m[1]),c?c.name:'Không tìm thấy']}
  if(p==='/gia')return[P.price(),'Gói thuê và bảng giá'];
  if(p==='/quy-trinh')return[P.process(),'Quy trình thuê'];
  if(m=p.match(/^\/chinh-sach\/?([\w-]*)$/))return[P.policy(m[1]),'Chính sách'];
  if(p==='/danh-gia')return[P.reviews(),'Đánh giá và phản hồi'];
  if(p==='/dat-lich')return[P.book(),'Đặt lịch'];
  if(p==='/dat-lich/thanh-cong')return[P.done(),'Đã giữ máy'];
  if(p==='/dang-nhap')return[P.login(),'Đăng nhập'];
  if(m=p.match(/^\/tai-khoan\/don\/([\w-]+)$/))return[P.order(m[1]),'Chi tiết đơn'];
  if(m=p.match(/^\/tai-khoan\/?([\w-]*)$/))return[P.account(m[1]),'Tài khoản'];
  if(p==='/lien-he')return[P.contact(),'Liên hệ'];
  if(p.startsWith('/quan-tri'))return[A.page(p),'Quản trị'];
  return[P.nf(),'Không tìm thấy'];
}
function render(top=true){
  const p=location.hash.slice(1).split('?')[0]||'/';
  const[html,title]=route();document.title=title+(title.includes('digitalcam')?'':' · '+BRAND);
  app.innerHTML=p.startsWith('/quan-tri')?`<main id="main" tabindex="-1">${html}</main>`:header(p)+`<main id="main" tabindex="-1">${html}</main>${footer()}`;
  if(top){window.scrollTo(0,0)}
  if($('#cat-grid'))catList();
  tick();
}
let _y=0;const refresh=()=>{_y=window.scrollY;render(false);window.scrollTo(0,_y)};
window.addEventListener('hashchange',()=>{S.ui.cal=0;render(true);const m=$('#main');if(m)m.focus({preventScroll:true})});

/* ---------- modal/toast ---------- */
const mr=$('#modal-root');let lastF=null;
function modal(html,cls=''){closeModal(true);lastF=document.activeElement;mr.innerHTML=`<div class="ov" data-ov><div class="modal ${cls}" role="dialog" aria-modal="true"><button class="ibtn x" data-act="close" aria-label="Đóng">${ic('x')}</button>${html}</div></div>`;document.body.classList.add('lock');const f=$('[autofocus]',mr)||$('input,select,textarea,.btn',mr);f&&f.focus()}
function closeModal(silent){mr.innerHTML='';document.body.classList.remove('lock');if(!silent&&lastF&&lastF.focus)lastF.focus()}
function toast(t,k=''){const e=document.createElement('div');e.className='toast '+k;e.textContent=t;$('#toasts').append(e);setTimeout(()=>e.remove(),4200)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mr.firstChild)closeModal();
  if(e.key==='Tab'&&mr.firstChild){const f=$$('button,input,select,textarea,a[href]',mr).filter(x=>!x.disabled);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});

/* ---------- countdown ---------- */
function tick(){
  $$('[data-cd]').forEach(el=>{const ms=+el.dataset.cd-Date.now(),a=Math.abs(ms),h=Math.floor(a/36e5),m=Math.floor(a%36e5/6e4);
    el.textContent=ms>=0?`Còn ${h} giờ ${pad(m)} phút để trả máy`:`Quá hạn ${h} giờ ${pad(m)} phút. Phụ thu trễ 50K`;
    el.classList.toggle('warn',ms>=0&&ms<2*36e5);el.classList.toggle('late',ms<0)});
}
setInterval(tick,30000);

/* ---------- booking logic ---------- */
function startBook(ids,p,d){S.b=newB();S.b.cams=ids;if(p!=null)S.b.pkg=p;if(d)S.b.date=d;S.b.step=ids.length?2:1;S.ui.cal=0;location.hash='#/dat-lich'}
function validate(b){
  const e={};
  if(b.step===1&&!b.cams.length)e.cams='Chọn ít nhất một máy để tiếp tục.';
  if(b.step===2){if(!b.date)e.date='Chọn ngày nhận máy trên lịch.';else if(!free(b.cams,b.date,b.pkg))e.date='Máy đã có người đặt trong thời gian này. Hãy chọn ngày khác.';
    if(b.method==='ship'&&!b.addr.trim())e.addr='Nhập địa chỉ nhận máy.'}
  if(b.step===3){if(b.name.trim().length<2)e.name='Nhập họ và tên.';if(!/^0\d{9}$/.test(b.phone.replace(/\s/g,'')))e.phone='Số điện thoại gồm 10 số, bắt đầu bằng 0.';if(!b.who)e.who='Chọn đối tượng.';
    const online=b.dep==='online'||b.method==='ship';if(online){if(!b.fb.trim())e.fb='Thuê online cần Facebook hoặc Zalo chính chủ.';if(!b.idf||!b.idb)e.id='Cần tải đủ ảnh CCCD hai mặt.'}}
  if(b.step===4){['a1','a2','a3'].forEach(k=>{if(!b[k])e[k]=1})}
  return e;
}
function setPath(path,v){const[a,k]=path.split('.');(a==='b'?S.b:S[a])[k]=v}

/* ---------- review modal ---------- */
function rvModal(oid){
  if(!S.user){modal(`<h2>Đăng nhập để đánh giá</h2><p class="muted" style="margin:0">Chỉ khách đã hoàn tất đơn thuê mới viết được đánh giá, để mọi đánh giá đều là trải nghiệm thật.</p><a class="btn btn-pri block" href="#/dang-nhap" data-act="close">Đăng nhập</a>`);return}
  const ords=S.orders.filter(o=>o.stage>=3&&!o.reviewed);
  if(!ords.length){modal(`<h2>Chưa có đơn để đánh giá</h2><p class="muted" style="margin:0">Bạn có thể đánh giá sau khi trả máy và đơn thuê hoàn tất.</p><a class="btn btn-pri block" href="#/may" data-act="close">Xem máy cho thuê</a>`);return}
  const F=S.rvForm;F.r=0;F.tags=new Set();F.photos=[];F.order=oid||ords[0].id;
  modal(`<h2>Viết đánh giá</h2><form onsubmit="return false" style="display:grid;gap:16px">
   <div class="field"><label for="rv-o">Đơn đã hoàn tất</label><select id="rv-o" data-rvo>${ords.map(o=>`<option value="${o.id}" ${o.id===F.order?'selected':''}>${o.id} · ${esc(CAM(o.cams[0]).name)}</option>`).join('')}</select></div>
   <div><div class="lbl" style="margin-bottom:4px">Bạn chấm mấy sao?</div><div class="starpick" id="sp" role="radiogroup" aria-label="Số sao">${[1,2,3,4,5].map(i=>`<button type="button" data-act="rstar" data-n="${i}" role="radio" aria-checked="false" aria-label="${i} sao">${star(1).replace('class=""','')}</button>`).join('')}</div><span class="errt" id="rv-e" role="alert"></span></div>
   <div><div class="lbl" style="margin-bottom:8px">Điểm nổi bật</div><div class="chips">${['Máy sạch','Đúng giờ','Hoàn cọc nhanh','Tư vấn nhiệt tình','Quy trình rõ ràng'].map(t=>`<button type="button" class="chip" data-act="rtag" data-t="${t}" aria-pressed="false">${t}</button>`).join('')}</div></div>
   <div class="field"><label for="rv-t">Chia sẻ trải nghiệm</label><textarea id="rv-t" maxlength="500" placeholder="Máy hoạt động thế nào, cửa hàng hỗ trợ ra sao?"></textarea><span class="help" id="rv-c">0 / 500</span></div>
   <div><label class="upl" id="rv-up"><input type="file" accept="image/*" multiple data-file="rvph">${ic('upload')}<br>Thêm ảnh (tối đa 3)</label><div class="ph" id="rv-pv" style="margin-top:8px"></div></div>
   <label class="chk"><input type="checkbox" id="rv-short" checked>Hiển thị tên rút gọn</label>
   <div class="nav-btns"><button type="button" class="btn btn-ghost" data-act="close">Hủy</button><button type="button" class="btn btn-pri" data-act="rsend">Gửi đánh giá</button></div></form>`,'wide');
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const ov=e.target.closest('[data-ov]');if(ov&&e.target===ov){closeModal();return}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,id=a.dataset.id;
  switch(act){
   case'theme':{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';break}
   case'burger':{const n=$('#nav'),o=n.classList.toggle('open');a.setAttribute('aria-expanded',o);document.body.classList.toggle('lock',o);break}
   case'close':closeModal();break;
   case'hometab':S.ui.homeTab=a.dataset.t;refresh();break;
   case'like':{S.liked.has(id)?S.liked.delete(id):S.liked.add(id);a.classList.toggle('on');a.setAttribute('aria-pressed',S.liked.has(id));toast(S.liked.has(id)?'Đã lưu máy này':'Đã bỏ lưu');break}
   case'rent':startBook([id],a.dataset.p!=null?+a.dataset.p:1);break;
   case'notify':modal(`<h2>Báo khi có máy</h2><p class="muted" style="margin:0">Để lại số điện thoại, cửa hàng sẽ nhắn bạn khi ${esc(CAM(id).name)} có lịch trống.</p><div class="field"><label for="n-p">Số điện thoại</label><input id="n-p" type="tel" inputmode="numeric" autofocus></div><button class="btn btn-pri block" data-act="notifyok">Gửi yêu cầu</button>`);break;
   case'notifyok':{const v=$('#n-p').value.replace(/\s/g,'');if(!/^0\d{9}$/.test(v)){toast('Số điện thoại chưa đúng định dạng','err');break}closeModal();toast('Đã ghi nhận. Cửa hàng sẽ nhắn bạn khi có máy.','ok');break}
   case'quick':{const c=$('#q-cam').value,d=$('#q-date').value,p=+$('#q-pkg').value;startBook([c],p,d||'');break}
   case'pkgpick':startBook([],+a.dataset.p);break;
   case'ptab':S.ui.price=a.dataset.t;refresh();break;
   case'view':S.ui.det.view=+a.dataset.v;refresh();break;
   case'dpk':S.ui.det.pkg=+a.dataset.p;refresh();break;
   case'dgo':{const d=S.ui.det;if(d.date&&!free([id],d.date,d.pkg))break;startBook([id],d.pkg,d.date);break}
   case'calp':S.ui.cal=Math.max(0,S.ui.cal-1);refresh();break;
   case'caln':S.ui.cal=Math.min(2,S.ui.cal+1);refresh();break;
   case'pickday':{if(location.hash.startsWith('#/dat-lich'))S.b.date=a.dataset.d;else S.ui.det.date=a.dataset.d;const d=pISO(a.dataset.d);S.ui.cal=(d.getFullYear()-today.getFullYear())*12+d.getMonth()-today.getMonth();refresh();break}
   case'catreset':S.ui.cat={brand:'',type:'',max:1200,ok:false,q:'',sort:'pop'};render(false);break;
   case'bcam':{const l=S.b.cams,i=l.indexOf(id);i<0?l.push(id):l.splice(i,1);S.b.err={};refresh();break}
   case'bpk':S.b.pkg=+a.dataset.p;refresh();break;
   case'bnext':{const e2=validate(S.b);S.b.err=e2;if(Object.keys(e2).length){refresh();const f=$('.bad input,.bad select,.errt');f&&f.scrollIntoView({block:'center',behavior:'smooth'});break}S.b.step++;S.b.err={};render(true);break}
   case'bback':S.b.step=Math.max(1,S.b.step-1);S.b.err={};render(true);break;
   case'copy':navigator.clipboard?.writeText(a.dataset.v).then(()=>toast('Đã sao chép','ok'),()=>toast('Không sao chép được'));break;
   case'bsubmit':{const e2=validate(S.b);S.b.err=e2;if(Object.keys(e2).length){refresh();break}
    modal(`<h2>Xác nhận lần cuối</h2><div class="note err">${ic('alert')}<span><b>Sau khi xác nhận, cửa hàng không nhận hủy lịch trong bất kỳ trường hợp nào.</b> Khoản 50K giữ slot không được hoàn lại.</span></div><p class="muted" style="margin:0">Bạn đã kiểm tra kỹ máy, ngày giờ nhận và trả chưa?</p><div class="nav-btns"><button class="btn btn-ghost" data-act="close">Quay lại kiểm tra</button><button class="btn btn-pri" data-act="bconfirm">Tôi hiểu, xác nhận</button></div>`);break}
   case'bconfirm':{a.classList.add('loading');setTimeout(()=>{const b=S.b,t=timing(b);const o={id:'MEE'+(2100+Math.floor(Math.random()*800)),cams:[...b.cams],pkg:b.pkg,start:t.s,end:t.e,stage:0,total:sumP(b.cams,b.pkg),dep:'Chờ nhận khi lấy máy',method:b.method,base:b.base,cust:b.name,phone:b.phone,depAmt:depOf(b.cams)};
      S.orders.unshift(o);S.done=o;S.b=newB();closeModal(true);location.hash='#/dat-lich/thanh-cong'},700);break}
   case'regtab':S.ui.reg=a.dataset.r==='1';refresh();break;
   case'login':{const ph=$('#l-ph').value.replace(/\s/g,''),pw=$('#l-pw').value,nm=$('#l-name')?.value.trim(),er=$('#l-err');
    const msg=!/^0\d{9}$/.test(ph)?'Số điện thoại gồm 10 số, bắt đầu bằng 0.':pw.length<6?'Mật khẩu cần ít nhất 6 ký tự.':(S.ui.reg&&!nm)?'Nhập họ và tên.':'';
    if(msg){er.innerHTML=`<span class="errt">${ic('alert')}${msg}</span>`;break}
    S.user={name:nm||'Khách thuê',phone:ph,verify:0};toast('Đăng nhập thành công','ok');location.hash='#/tai-khoan/don';break}
   case'social':toast('Đăng nhập mạng xã hội chưa được kết nối trong bản thiết kế');break;
   case'logout':S.user=null;toast('Đã đăng xuất');location.hash='#/';break;
   case'otab':S.ui.otab=a.dataset.t;refresh();break;
   case'saveprof':toast('Đã lưu thay đổi','ok');break;
   case'extend':{const o=S.orders.find(x=>x.id===id),c=CAM(o.cams[0]);modal(`<h2>Gia hạn thuê</h2><p class="muted" style="margin:0">Thêm 1 ngày cho ${esc(c.name)} với giá ${vnd(c.p[1])}. Chỉ gia hạn được khi máy chưa có người đặt sau bạn.</p><div class="note warn">${ic('alert')}<span>Trả máy trễ làm lỡ lịch khách sau sẽ phải đền bù theo quy định.</span></div><button class="btn btn-pri block" data-act="extok" data-id="${id}">Gia hạn thêm 1 ngày</button>`);break}
   case'extok':{const o=S.orders.find(x=>x.id===id);o.end=new Date(+o.end+24*36e5);o.total+=CAM(o.cams[0]).p[1];closeModal(true);toast('Đã gia hạn thêm 1 ngày','ok');refresh();break}
   case'retm':modal(`<h2>Báo trả máy</h2><div class="field"><label for="r-t">Giờ bạn mang máy đến trả</label><select id="r-t" autofocus>${['Trong 1 giờ tới','Trong 2 giờ tới','Đúng giờ hẹn'].map(t=>`<option>${t}</option>`).join('')}</select></div><p class="muted sm-t" style="margin:0">Cửa hàng sẽ kiểm tra máy rồi hoàn cọc.</p><button class="btn btn-pri block" data-act="retok">Gửi thông báo</button>`);break;
   case'retok':closeModal(true);toast('Đã báo cửa hàng. Hẹn gặp bạn!','ok');break;
   case'rvf':S.ui.rv.f=a.dataset.f;if(location.hash!=='#/danh-gia'){location.hash='#/danh-gia'}else refresh();break;
   case'helpful':{S.helped.has(+id)?S.helped.delete(+id):S.helped.add(+id);refresh();break}
   case'writerv':rvModal(a.dataset.oid);break;
   case'rstar':{S.rvForm.r=+a.dataset.n;$$('#sp button').forEach((b,i)=>{b.classList.toggle('on',i<S.rvForm.r);b.setAttribute('aria-checked',i+1===S.rvForm.r)});$('#rv-e').textContent='';break}
   case'rtag':{const t=a.dataset.t,T=S.rvForm.tags;T.has(t)?T.delete(t):T.add(t);a.classList.toggle('on');a.setAttribute('aria-pressed',T.has(t));break}
   case'rsend':{const F=S.rvForm;if(!F.r){$('#rv-e').innerHTML=`${ic('alert')} Chọn số sao trước khi gửi.`;break}
    const t=$('#rv-t').value.trim();if(t.length<10){toast('Hãy viết ít nhất 10 ký tự','err');break}
    const o=S.orders.find(x=>x.id===F.order);o.reviewed=true;const nm=S.user.name.split(' ');const disp=$('#rv-short').checked&&nm.length>1?nm[0]+' '+nm[nm.length-1][0]+'.':S.user.name;
    S.reviews.unshift({id:Date.now(),name:disp,cam:o.cams[0],pkg:o.pkg,r:F.r,t,tags:[...F.tags],ago:0,ph:0,imgs:F.photos.slice(0,3),help:0,mine:true});
    closeModal(true);toast('Đã gửi đánh giá. Cảm ơn bạn!','ok');refresh();break}
   case'lightbox':modal(`<h2>Ảnh của khách</h2><div class="gal-main">${camSVG(CAM(id))}</div>`,'wide');break;
   case'lightimg':modal(`<h2>Ảnh của khách</h2><img alt="Ảnh khách tải lên" src="${a.querySelector('img').src}" style="border-radius:16px;width:100%">`,'wide');break;
   case'contact':{const n=$('#ct-n').value.trim(),p=$('#ct-p').value.replace(/\s/g,''),m=$('#ct-m').value.trim();if(!n||!/^0\d{9}$/.test(p)||!m){toast('Nhập đủ họ tên, số điện thoại 10 số và nội dung','err');break}toast('Đã gửi. Cửa hàng sẽ phản hồi qua Zalo.','ok');break}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.bind&&t.type!=='radio'&&t.tagName!=='SELECT'){setPath(t.dataset.bind,t.type==='checkbox'?t.checked:t.value);if(t.dataset.bind==='user.name')S.user.name=t.value;return}
  if(t.dataset.f){const f=S.ui.cat,k=t.dataset.f;f[k]=t.type==='checkbox'?t.checked:t.type==='range'?+t.value:t.value;if(k==='max')$('#f-maxv').textContent=K(f.max);catList()}
  if(t.id==='rv-t'){$('#rv-c').textContent=t.value.length+' / 500'}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.bind&&(t.type==='radio'||t.tagName==='SELECT'||t.type==='checkbox')){setPath(t.dataset.bind,t.type==='checkbox'?t.checked:t.value);if(t.dataset.bind==='b.method'&&t.value==='ship')S.b.dep='online';if(t.dataset.re)refresh();return}
  if(t.dataset.f){const f=S.ui.cat;f[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;catList()}
  if(t.dataset.calc){S.ui.calc[t.dataset.calc]=t.dataset.calc==='pkg'?+t.value:t.value;refresh()}
  if(t.dataset.rvs!==undefined){S.ui.rv.sort=t.value;refresh()}
  if(t.dataset.rvo!==undefined){S.rvForm.order=t.value}
  if(t.dataset.chk!==undefined){S.ui.chk[t.dataset.chk]=t.checked}
  if(t.dataset.file){const fl=[...t.files];if(!fl.length)return;const k=t.dataset.file;
    if(k==='idf'||k==='idb'){S.b[k]=fl[0].name;refresh()}
    else if(k==='verify'){S.user.verify=1;toast('Đã gửi ảnh CCCD, đang chờ duyệt','ok');refresh()}
    else if(k==='rvph'){S.rvForm.photos=[];fl.slice(0,3).forEach(f=>{const r=new FileReader();r.onload=()=>{S.rvForm.photos.push(r.result);const pv=$('#rv-pv');if(pv)pv.innerHTML=S.rvForm.photos.map(u=>`<button type="button" style="width:64px;height:64px;border-radius:12px;border:1px solid var(--line);padding:0;overflow:hidden"><img alt="Ảnh xem trước" src="${u}" style="width:100%;height:100%;object-fit:cover"></button>`).join('')};r.readAsDataURL(f)})}}
});

render(false);
})();
</script>
