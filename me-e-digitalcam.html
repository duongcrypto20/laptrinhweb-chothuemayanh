<style>
:root{
  --bg:#FCF8EC;--bg2:#F6EDD0;--card:#FFFDF6;--ink:#2B1A12;--ink2:#6E5A4E;--line:#E3D5B0;
  --pri:#6B230A;--pri2:#4A1807;--pri-ink:#FCF8EC;--acc:#E8D296;--acc2:#F1E3B9;--acc-ink:#2E0F04;
  --ok:#2F6B40;--okbg:#E4F1E7;--warn:#8A5600;--warnbg:#FBEFD3;--err:#B3261E;--errbg:#F9E1DF;--info:#2F5F7F;--infobg:#E1EDF4;
  --photo:#F1E3B9;--star:#C98A1B;--shadow:0 12px 32px rgba(46,15,4,.13);--hole:var(--bg);
  --serif:'Lora',Georgia,'Times New Roman',serif;
  --sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42 0 0 0 0 .14 0 0 0 0 .04 0 0 0 .07 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:"light"){:root:not([data-theme="dark"]){
  --bg:#1B0D07;--bg2:#24110A;--card:#2C160D;--ink:#F4E9CC;--ink2:#C9B592;--line:#4A2A1B;
  --pri:#E8D296;--pri2:#F1E3B9;--pri-ink:#2E0F04;--acc:#5A2410;--acc2:#3A1A0F;--acc-ink:#F1E3B9;
  --ok:#7CC38F;--okbg:#1E3326;--warn:#E5B04A;--warnbg:#3A2C10;--err:#F0897F;--errbg:#3F1A17;--info:#8DBBD8;--infobg:#1B2C38;
  --photo:#3A1F13;--star:#E8D296;--shadow:0 12px 32px rgba(0,0,0,.45);
}}
:root[data-theme="light"]{
  --bg:#1B0D07;--bg2:#24110A;--card:#2C160D;--ink:#F4E9CC;--ink2:#C9B592;--line:#4A2A1B;
  --pri:#E8D296;--pri2:#F1E3B9;--pri-ink:#2E0F04;--acc:#5A2410;--acc2:#3A1A0F;--acc-ink:#F1E3B9;
  --ok:#7CC38F;--okbg:#1E3326;--warn:#E5B04A;--warnbg:#3A2C10;--err:#F0897F;--errbg:#3F1A17;--info:#8DBBD8;--infobg:#1B2C38;
  --photo:#3A1F13;--star:#E8D296;--shadow:0 12px 32px rgba(0,0,0,.45);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg) var(--grain);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100%}
body.lock{overflow:hidden}
h1,h2,h3,h4{font-family:var(--serif);color:var(--ink);line-height:1.2;margin:0 0 .5em;font-weight:700;text-wrap:balance}
h1{font-size:clamp(34px,5.4vw,60px);letter-spacing:-.01em}
h2{font-size:clamp(26px,3.4vw,38px)}
h3{font-size:clamp(19px,2vw,22px);font-weight:600}
p{margin:0 0 1em}
a{color:var(--pri);text-decoration-thickness:1px;text-underline-offset:3px}
img,svg{max-width:100%}
.muted{color:var(--ink2)}
.sm-t{font-size:14px}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
.sec{padding:clamp(52px,7vw,92px) 0}
.alt{background:var(--bg2);--hole:var(--bg2)}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.sec-h h2{margin:0}
.sec-h p{margin:6px 0 0;max-width:56ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;box-shadow:0 0 0 5px var(--pri)}
.skip{position:absolute;left:8px;top:-60px;background:var(--pri);color:var(--pri-ink);padding:10px 14px;border-radius:8px;z-index:100}
.skip:focus{top:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1 var(--sans);padding:0 22px;height:48px;border-radius:999px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;transition:background .15s,transform .15s,border-color .15s;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn.lg{height:56px;font-size:16px;padding:0 30px}
.btn.sm{height:38px;font-size:14px;padding:0 16px}
.btn.block{width:100%}
.btn-pri{background:var(--pri);color:var(--pri-ink)}
.btn-pri:hover{background:var(--pri2)}
.btn-acc{background:var(--acc);color:var(--acc-ink)}
.btn-acc:hover{filter:brightness(.95)}
.btn-out{background:transparent;color:var(--pri);border-color:var(--pri)}
.btn-out:hover{background:var(--acc2)}
.btn-ghost{background:transparent;color:var(--pri);padding:0 10px}
.btn-ghost:hover{background:var(--acc2)}
.btn-err{background:var(--err);color:#fff}
.btn:active{transform:translateY(1px)}
.btn[disabled],.btn.off{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn.loading{pointer-events:none;color:transparent;position:relative}
.btn.loading::after{content:"";position:absolute;width:20px;height:20px;border:2.5px solid var(--pri-ink);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* phần đầu của website*/
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:20px;height:72px}
.logo{display:flex;align-items:center;gap:10px;font:700 24px var(--serif);color:var(--ink);text-decoration:none}
.logo svg{width:34px;height:34px}
.nav{display:flex;gap:4px;margin-left:12px}
.nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:500;font-size:15px}
.nav a:hover{background:var(--acc2)}
.nav a.on{background:var(--acc);color:var(--acc-ink)}
.hdr-act{margin-left:auto;display:flex;gap:8px;align-items:center}
.ibtn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ibtn:hover{background:var(--acc2)}
.ibtn svg{width:22px;height:22px}
.burger{display:none}
@media(max-width:900px){
  .nav{position:fixed;inset:calc(env(safe-area-inset-top,0px) + 72px) 0 0 0;background:var(--bg);flex-direction:column;padding:20px 20px 40px;margin:0;transform:translateX(100%);transition:transform .25s;gap:2px;overflow:auto}
  .nav.open{transform:none}
  .nav a{font:600 20px var(--serif);padding:14px 12px;border-radius:12px}
  .burger{display:grid}
  .hdr-act .btn{display:none}
}

/* stamp (perforated edge) */
.stamp{--d:13px;padding:var(--d);filter:drop-shadow(0 10px 16px rgba(46,15,4,.16));
  background:
   radial-gradient(circle at 50% 0,var(--hole) 5px,transparent 5.5px) top/16px var(--d) repeat-x,
   radial-gradient(circle at 50% 100%,var(--hole) 5px,transparent 5.5px) bottom/16px var(--d) repeat-x,
   radial-gradient(circle at 0 50%,var(--hole) 5px,transparent 5.5px) left/var(--d) 16px repeat-y,
   radial-gradient(circle at 100% 50%,var(--hole) 5px,transparent 5.5px) right/var(--d) 16px repeat-y,
   var(--card)}
.stamp-in{border:1px solid var(--line);padding:18px;height:100%;border-radius:2px}

/* hero */
.hero{padding:clamp(36px,5vw,72px) 0 clamp(80px,9vw,120px)}
.hero-in{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(24px,5vw,64px);align-items:center}
.hero h1{margin-bottom:.4em}
.lead{font-size:clamp(17px,1.6vw,19px);max-width:52ch;color:var(--ink2)}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0 26px}
.trust{list-style:none;padding:0;margin:0;display:flex;gap:10px 22px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.trust li{display:flex;align-items:center;gap:8px}
.trust svg{width:18px;height:18px;color:var(--pri)}
.hero-art{position:relative;min-height:380px;display:grid;place-items:center}
.hero-art .big{width:min(100%,430px);transform:rotate(2deg);animation:land .9s cubic-bezier(.2,.8,.2,1) both}

.tag-pill{position:absolute;right:-6px;top:8%;background:var(--pri);color:var(--pri-ink);padding:10px 16px;border-radius:14px 14px 14px 4px;font-weight:600;font-size:14px;box-shadow:var(--shadow);transform:rotate(4deg)}

@media(max-width:900px){.hero-in{grid-template-columns:1fr}.hero-art{min-height:300px;order:-1}.hero-art .small{width:40%}}

/* quick booking */
.quick{margin-top:-64px;position:relative;z-index:2}
.quick-in{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:20px;display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:14px;align-items:end}
@media(max-width:900px){.quick-in{grid-template-columns:1fr 1fr}.quick-in>*:first-child{grid-column:1/-1}.quick-in .btn{grid-column:1/-1}}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font:600 14px var(--sans)}
input[type=text],input[type=tel],input[type=password],input[type=search],input[type=date],select,textarea{width:100%;font:400 16px var(--sans);color:var(--ink);background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:0 14px;height:48px;transition:border-color .15s,background .15s}

input:hover,select:hover,textarea:hover{border-color:#CDB46A}
input:focus,select:focus,textarea:focus{background:var(--card);border-color:var(--pri);outline:none;box-shadow:0 0 0 3px var(--acc)}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--err)}
.help{font-size:13px;color:var(--ink2)}
.errt{font-size:13px;color:var(--err);display:flex;gap:6px;align-items:center}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--pri);flex:none}
.chk.bad{color:var(--err)}
input[type=range]{accent-color:var(--pri);width:100%}

/* badges & chips */
.badge{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--sans);padding:4px 10px;border-radius:999px;background:var(--acc2);color:var(--ink)}
.b-ok{background:var(--okbg);color:var(--ok)}.b-low{background:var(--warnbg);color:var(--warn)}.b-out{background:var(--errbg);color:var(--err)}.b-info{background:var(--infobg);color:var(--info)}.b-pri{background:var(--pri);color:var(--pri-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;font:500 14px var(--sans);cursor:pointer}
.chip:hover{border-color:var(--pri)}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}

/* camera cards */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media(max-width:1000px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid4,.grid3{grid-template-columns:1fr}.snap{display:flex!important;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1*clamp(16px,4vw,48px));padding:4px clamp(16px,4vw,48px) 14px}.snap>*{flex:0 0 82%;scroll-snap-align:start}}
.cam{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 22px 6px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.cam:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.cam-ph{display:block;position:relative;aspect-ratio:4/3;background:radial-gradient(120% 90% at 30% 20%,var(--acc2),var(--photo));padding:14px 18px}
.cam-ph svg{width:100%;height:100%}
.cam-ph .badge{position:absolute;left:12px;top:12px}
.cam.out .cam-ph svg{filter:grayscale(.8);opacity:.6}
.like{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:color-mix(in srgb,var(--card) 85%,transparent);color:var(--pri);cursor:pointer;display:grid;place-items:center}
.like svg{width:18px;height:18px;width:18px!important;height:18px!important}
.like.on svg{fill:var(--pri)}
.cam-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:4px;flex:1}
.cam-b h3{margin:0;font-size:18px}
.cam-b p{margin:0;font-size:14px;color:var(--ink2)}
.cam-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:14px}
.price{font-size:14px;color:var(--ink2)}
.price b{font:700 22px var(--serif);color:var(--ink)}
.price small{display:block;font-size:12px}

/* package tickets */
.pk{height:100%}
.pk .stamp-in{display:flex;flex-direction:column;gap:6px;background:transparent}
.pk h3{margin:0;font-size:26px}
.pk .big{font:700 34px var(--serif);color:var(--pri);margin:6px 0 0}
.pk ul{list-style:none;margin:10px 0 18px;padding:0;font-size:14px;display:grid;gap:6px}
.pk li{display:flex;gap:8px}
.pk li svg{width:16px;height:16px;flex:none;margin-top:4px;color:var(--ok)}
.pk .btn{margin-top:auto}
.pk.best{--d:13px}
.pk.best .stamp-in{background:var(--acc2)}

/* timeline */
.tl{position:relative;display:grid;gap:26px;padding-left:64px;max-width:760px}
.tl::before{content:"";position:absolute;left:23px;top:8px;bottom:8px;border-left:2px dashed #CDB46A}
.tl-i{position:relative}
.tl-i .n{position:absolute;left:-64px;top:0;width:48px;height:48px;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font:700 20px var(--serif)}
.tl-i h3{margin:0 0 4px}
.tl-i p{margin:0 0 8px;color:var(--ink2)}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 14px;font-size:14px;background:var(--infobg);color:var(--ink)}

.note.warn{background:var(--warnbg)}.note.warn svg{color:var(--warn)}
.note.ok{background:var(--okbg)}.note.ok svg{color:var(--ok)}
.note.info svg{color:var(--info)}

/* split */
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.rows{display:grid;gap:0}
.rows>div{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.rows>div:last-child{border:0}
.rows svg{width:26px;height:26px;color:var(--pri);flex:none;margin-top:2px}
.rows h4{margin:0 0 2px;font-size:17px}
.rows p{margin:0;color:var(--ink2);font-size:15px}
.kv{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.kv li{display:flex;justify-content:space-between;gap:16px;border-bottom:1px dashed var(--line);padding-bottom:8px;font-size:15px}
.kv li b{font-weight:600;text-align:right}
.lines{margin:0;padding-left:20px;display:grid;gap:8px}

/* reviews */
.score{display:flex;gap:20px;align-items:center;margin-bottom:18px}
.score .n{font:700 64px/1 var(--serif);color:var(--pri)}
.stars{display:inline-flex;gap:2px;color:var(--star)}

.bars{display:grid;gap:6px;font-size:13px}
.bars button{display:grid;grid-template-columns:28px 1fr 28px;gap:8px;align-items:center;background:none;border:0;padding:2px 0;cursor:pointer;color:var(--ink);font:inherit}

.rv{background:var(--card);border:1px solid var(--line);border-radius:6px 22px 22px 22px;padding:20px;display:flex;flex-direction:column;gap:10px;break-inside:avoid}

.rv-h small{color:var(--ink2)}
.rv p{margin:0}
.ph{display:flex;gap:8px}
.ph button{width:64px;height:64px;border-radius:12px;border:1px solid var(--line);background:var(--photo);padding:0;cursor:pointer;overflow:hidden}
.ph button svg,.ph button img{width:100%;height:100%;object-fit:cover}
.reply{margin-left:14px;border-left:3px solid var(--pri);background:var(--bg2);border-radius:0 12px 12px 0;padding:10px 14px;font-size:14px}
.reply b{display:block;font-size:13px;color:var(--pri)}
.helpful{align-self:flex-start;background:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font:500 13px var(--sans);color:var(--ink2);cursor:pointer}
.helpful.on{background:var(--acc2);color:var(--ink);border-color:var(--pri)}
.masonry{columns:2;column-gap:22px}
.masonry>*{margin-bottom:22px}
@media(max-width:800px){.masonry{columns:1}}
.starpick{display:flex;gap:4px}
.starpick button{background:none;border:0;padding:2px;cursor:pointer;color:var(--star)}
.starpick svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.6}
.starpick button.on svg{fill:currentColor}

/* tables / tabs */
.tbl-w{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:15px}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--acc2);font-weight:600;position:sticky;top:0}
td:first-child,th:first-child{position:sticky;left:0;background:inherit}
tbody tr:hover{background:var(--bg2)}
tbody td:first-child{background:var(--card);font-weight:600}
tbody tr:hover td:first-child{background:var(--bg2)}
td.n{font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:24px}
.tabs a,.tabs button{padding:12px 18px;border:0;background:none;color:var(--ink2);font:600 15px var(--sans);text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent;cursor:pointer}
.tabs a:hover,.tabs button:hover{color:var(--pri)}
.tabs .on{color:var(--pri);border-bottom-color:var(--pri);background:var(--acc2);border-radius:10px 10px 0 0}
details{border-bottom:1px solid var(--line)}
summary{cursor:pointer;padding:18px 4px;font:600 17px var(--serif);list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:500 24px var(--sans);color:var(--pri);line-height:1}
details[open] summary::after{content:"–"}
details p{padding:0 4px 18px;margin:0;color:var(--ink2);max-width:70ch}

/* catalog */
.cat{display:grid;grid-template-columns:260px 1fr;gap:32px;align-items:start}
.filters{position:sticky;top:96px;display:grid;gap:22px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.filters fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
.filters legend{font:600 14px var(--sans);margin-bottom:6px;padding:0}
@media(max-width:900px){.cat{grid-template-columns:1fr}.filters{position:static}}
.empty{text-align:center;padding:56px 20px;background:var(--card);border:1px dashed #CDB46A;border-radius:22px}
.empty svg{width:64px;height:64px;color:var(--pri);margin-bottom:8px}
.empty h3{margin-bottom:6px}

/* detail */
.crumb{font-size:14px;color:var(--ink2);margin-bottom:18px}
.crumb a{color:var(--ink2)}
.det{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(24px,4vw,56px);align-items:start}
@media(max-width:900px){.det{grid-template-columns:1fr}}
.gal-main{aspect-ratio:4/3;border-radius:28px 28px 28px 8px;background:radial-gradient(120% 90% at 30% 20%,var(--acc2),var(--photo));padding:6% 8%;border:1px solid var(--line);overflow:hidden}
.gal-main svg{width:100%;height:100%;transition:transform .35s}
.thumbs{display:flex;gap:10px;margin-top:12px}
.thumbs button{width:84px;aspect-ratio:4/3;border-radius:14px;border:2px solid transparent;background:var(--photo);padding:6px;cursor:pointer}
.thumbs button.on{border-color:var(--pri)}
.buy{position:sticky;top:96px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;display:grid;gap:16px}
.pkpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pkpick button{border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:10px 4px;cursor:pointer;color:var(--ink);font:inherit;line-height:1.25}
.pkpick button b{display:block;font:700 16px var(--serif)}
.pkpick button small{font-size:12px;color:var(--ink2)}
.pkpick button.on{border-color:var(--pri);background:var(--acc2);box-shadow:inset 0 0 0 1px var(--pri)}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.total b{font:700 30px var(--serif);color:var(--pri)}
.cal{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--bg)}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font:600 16px var(--serif)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-g .w{font-size:12px;color:var(--ink2);padding:4px 0}
.day{height:40px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:500 14px var(--sans);cursor:pointer;position:relative}
.day:hover:not([disabled]){background:var(--acc2)}
.day[disabled]{color:var(--ink2);opacity:.4;cursor:not-allowed}
.day.bk{text-decoration:line-through;opacity:.5;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px)}
.day.td{box-shadow:inset 0 0 0 1.5px var(--pri)}
.day.rg{background:var(--acc);color:var(--acc-ink);border-radius:0}
.day.st{background:var(--pri);color:var(--pri-ink);border-radius:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
.mobbar{display:none}
@media(max-width:900px){.mobbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));gap:12px;align-items:center;justify-content:space-between}.mobbar b{font:700 20px var(--serif);color:var(--pri)}.mob-pad{padding-bottom:84px}}

/* booking */
.steps{display:flex;gap:0;margin:0 0 28px;padding:0;list-style:none}
.steps li{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--ink2);text-align:center;position:relative}
.steps li::before{content:"";position:absolute;top:17px;left:-50%;width:100%;border-top:2px solid var(--line);z-index:0}

.steps .c{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;font:700 15px var(--serif);position:relative;z-index:1}
.steps .done .c{background:var(--ok);border-color:var(--ok);color:#fff}
.steps .done::before,.steps .cur::before{border-color:var(--ok)}
.steps .cur .c{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.steps .cur{color:var(--ink);font-weight:600}
.steps .done .c svg{width:18px;height:18px}
@media(max-width:600px){.steps li span:last-child{display:none}}
.book{display:grid;grid-template-columns:1fr 360px;gap:32px;align-items:start}
@media(max-width:900px){.book{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(18px,3vw,30px);display:grid;gap:22px}
.sum{position:sticky;top:96px}
.pick{display:flex;gap:12px;align-items:center;padding:10px;border:1.5px solid var(--line);border-radius:16px;cursor:pointer;background:transparent;text-align:left;width:100%;font:inherit;color:var(--ink)}
.pick .th{width:76px;aspect-ratio:4/3;background:var(--photo);border-radius:10px;padding:4px;flex:none}
.pick.on{border-color:var(--pri);background:var(--acc2)}
.pick.off{opacity:.5;cursor:not-allowed}
.pick b{display:block;font-family:var(--serif)}
.pick small{color:var(--ink2)}
.pick .tk{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.pick.on .tk{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.pick .tk svg{width:14px;height:14px}
.radio{display:flex;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:16px;cursor:pointer}
.radio input{accent-color:var(--pri);margin-top:4px}
.radio.on{border-color:var(--pri);background:var(--acc2)}
.radio b{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.row2{grid-template-columns:1fr}}
.qr{width:170px;height:170px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;flex:none}
.copy{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--bg2);padding:8px 12px;border-radius:10px;font-size:14px}
.nav-btns{display:flex;justify-content:space-between;gap:12px}
.upl{border:1.5px dashed #CDB46A;border-radius:14px;padding:14px;text-align:center;cursor:pointer;font-size:14px;color:var(--ink2);display:block}

/* account */
.acc{display:grid;grid-template-columns:240px 1fr;gap:32px;align-items:start}
@media(max-width:800px){.acc{grid-template-columns:1fr}}
.side{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:4px}
.side .me{display:flex;gap:12px;align-items:center;padding:4px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.side a,.side button{display:block;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:500;background:none;border:0;text-align:left;font-size:15px;cursor:pointer}
.side a:hover,.side button:hover{background:var(--acc2)}
.side a.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
@media(max-width:800px){.side{display:flex;overflow-x:auto;gap:6px}.side .me{display:none}.side a,.side button{white-space:nowrap}}
.ord{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:center}
.ord .th{aspect-ratio:4/3;background:var(--photo);border-radius:12px;padding:6px}
.ord h3{margin:0;font-size:18px}
.ord .meta{font-size:14px;color:var(--ink2)}
@media(max-width:700px){.ord{grid-template-columns:72px 1fr}.ord .act{grid-column:1/-1}}
.cd{font:700 20px var(--serif);color:var(--pri)}
.cd.warn{color:var(--warn)}.cd.late{color:var(--err)}
.prog{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:12px 0}
.prog div{font-size:12px;color:var(--ink2);text-align:center}
.prog div::before{content:"";display:block;height:8px;border-radius:99px;background:var(--line);margin-bottom:6px}
.prog .d::before{background:var(--ok)}.prog .c::before{background:var(--pri)}
.prog .c{color:var(--ink);font-weight:600}

/* modal & toast */
.ov{position:fixed;inset:0;z-index:80;background:rgba(46,15,4,.6);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--card);border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,.35);width:min(100%,540px);padding:clamp(20px,4vw,32px);position:relative;display:grid;gap:16px;max-height:calc(100dvh - 32px);overflow:auto;animation:pop .2s ease-out}
.modal.wide{width:min(100%,680px)}
.modal h2{font-size:26px;margin:0;padding-right:36px}
.modal .x{position:absolute;right:12px;top:12px}
@keyframes pop{from{opacity:0;transform:scale(.96)}}

const LOGO=ASSETS.logo;
/* UC11: loại thiết bị */
const CATS=[
 {id:'mirror',name:'Mirrorless',desc:'Máy mirrorless ống kính rời, thân gọn, hợp du lịch và vlog.',on:true,shape:'mirror'},
 {id:'retro',name:'Mirrorless dáng cổ điển',desc:'Thân máy phong cách film với núm xoay cơ học, màu ảnh đẹp.',on:true,shape:'retro'},
 {id:'compact',name:'Compact',desc:'Máy nhỏ gọn, lens cố định, bỏ túi mang đi cả ngày.',on:true,shape:'compact'}
];
const CATN=id=>(CATS.find(x=>x.id===id)||{name:'Chưa phân loại'}).name;
const catOn=c=>(CATS.find(x=>x.id===c.cat)||{on:true}).on;
/* UC14: tình trạng thực tế */
const CONDS={good:['Tốt','b-ok'],maint:['Cần bảo dưỡng','b-low'],repair:['Đang sửa chữa','b-low'],broken:['Hỏng hoặc thất lạc','b-out']};
CAMS.forEach(c=>{c.model=c.name.replace(/^(Canon EOS|Canon|Fujifilm) /,'');c.cat=c.type;c.cond='good';c.condNote='';c.active=true;c.qty=c.st==='out'?0:c.st==='low'?1:2;c.desc='';c.hist=[];
  c.imgs=ASSETS[c.id]?[{id:'d-'+c.id,url:ASSETS[c.id],name:'Ảnh '+c.name}]:[];});
const syncSt=c=>{c.st=(!c.active||!catOn(c))?'stop':(c.cond==='repair'||c.cond==='broken')?'fix':c.qty<=0?'out':c.qty===1?'low':'ok';return c};
CAMS.forEach(syncSt);
const CAM=id=>CAMS.find(c=>c.id===id);
const STT={ok:['Còn máy','b-ok'],low:['Sắp hết','b-low'],out:['Hết máy','b-out'],fix:['Đang bảo trì','b-low'],stop:['Ngừng cung cấp','b-out']};
const rentable=c=>!!c&&(c.st==='ok'||c.st==='low');
const VIS=()=>CAMS.filter(c=>c.st!=='stop');
const BRANDS=()=>[...new Set(CAMS.map(c=>c.brand))];
const booked=c=>{const s=new Set(),h=hash(c.id);
  for(let i=0;i<45;i++){ if(c.st==='out'?i<12:((h*31+i*17)%11<2&&i>0)) s.add(iso(addD(today,i))); }
  return s;};
const BOOKED=Object.fromEntries(CAMS.map(c=>[c.id,booked(c)]));
const span=p=>p===0?0:p;
/* UC06: khả dụng = lịch mẫu + các đơn đang có hiệu lực (Chờ xử lý, Đã xác nhận, Đã nhận máy, Đang thuê) */
const BLOCK=[0,1,2,3];
const daysOf=(s,e)=>{const r=[];let d=new Date(s.getFullYear(),s.getMonth(),s.getDate());const z=new Date(e.getFullYear(),e.getMonth(),e.getDate());for(;d<=z;d=addD(d,1))r.push(iso(d));return r};
const occDays=(id,ex)=>{const s=new Set();S.orders.forEach(o=>{if(o.id===ex||!BLOCK.includes(o.stage)||!o.cams.includes(id))return;daysOf(o.start,o.end).forEach(k=>s.add(k))});return s};
const busyOf=(id,ex)=>{const s=new Set(BOOKED[id]||[]);occDays(id,ex).forEach(k=>s.add(k));return s};
const free=(ids,d,p,ex)=>{const sets=ids.map(id=>busyOf(id,ex));for(let i=0;i<=span(p);i++){const k=iso(addD(pISO(d),i));if(sets.some(s=>s.has(k)))return false}return true};
const nextFree=(ids,d,p)=>{for(let i=1;i<40;i++){const x=iso(addD(pISO(d),i));if(free(ids,x,p))return x}return null};

const promoSt=p=>{if(!p.on)return'off';const t=iso(today);if(t<p.from)return'soon';if(t>p.to)return'ended';return'live'};
const PRST={live:['Đang diễn ra','b-ok'],soon:['Sắp diễn ra','b-info'],ended:['Đã kết thúc','b-out'],off:['Đang tắt','b-low']};
function evalPromo(code,gross){
  code=String(code||'').trim().toUpperCase();
  if(!code)return{err:'Nhập mã khuyến mãi.'};
  const p=ADM.promos.find(x=>x.code.toUpperCase()===code);
  if(!p)return{err:'Mã khuyến mãi không tồn tại.'};
  const s=promoSt(p);
  if(s==='off')return{err:'Chương trình này đang tạm dừng.'};
  if(s==='soon')return{err:'Chương trình chưa bắt đầu.'};
  if(s==='ended')return{err:'Chương trình đã kết thúc.'};
  if(gross<p.min)return{err:`Đơn cần từ ${vnd(p.min)} để dùng mã này.`};
  let d=p.type==='pct'?Math.round(gross*p.value/100):p.value;
  if(p.type==='pct'&&p.max>0)d=Math.min(d,p.max);
  return{p,code:p.code,disc:Math.min(d,gross)};
}
const bDisc=b=>{if(!b.promo)return 0;const r=evalPromo(b.promo.code,sumP(b.cams,b.pkg));return r.err?0:r.disc};
/* UC13, UC26: kiểm tra và đọc ảnh tải lên */
const IMG_OK=['image/jpeg','image/png','image/webp'];
function readImgs(files,{max=3,mb=3,have=0},cb){
  const list=[...files],room=Math.max(0,max-have),use=list.slice(0,room),out=[];
  if(list.length>room)toast(`Chỉ thêm được tối đa ${max} ảnh.`,'err');
  let pend=use.length;if(!pend)return;
  const done=()=>{if(!--pend)cb(out)};
  use.forEach(f=>{
    if(!IMG_OK.includes(f.type)){toast(`"${f.name}" không đúng định dạng. Chỉ nhận JPG, PNG, WEBP.`,'err');return done()}
    if(f.size>mb*1048576){toast(`"${f.name}" vượt quá ${mb}MB.`,'err');return done()}
    const r=new FileReader();r.onload=()=>{out.push({id:nextId(),url:r.result,name:f.name});done()};r.onerror=done;r.readAsDataURL(f);
  });
}

function seed(o){
  const by='Nhân viên 1';
  o.gross=sumP(o.cams,o.pkg);o.disc=0;o.total=o.gross;o.method='direct';o.base='Cs1';o.note=o.note||'';o.reviewed=!!o.reviewed;o.log=[];o.hold='';o.promo='';
  const s=+o.start,e=+o.end,L=(t,x,b)=>o.log.push({at:new Date(t),by:b||by,txt:x});
  L(s-48*36e5,'Khách gửi yêu cầu thuê và thanh toán giữ slot',o.cust);
  if(o.stage===6){L(s-30*36e5,'Hủy đơn. Lý do: '+o.cancelReason);return o}
  if(o.stage>=1)L(s-40*36e5,'Xác nhận đơn');
  if(o.stage>=2){
    o.deposit={type:'Tiền + CCCD',amount:depOf(o.cams),asset:'',by,at:new Date(s),status:'held',refund:0,note:''};
    o.condBefore={desc:'Máy sạch, lens không xước, màn hình nguyên vẹn, pin đầy.',acc:accAll(),by,at:new Date(s),photos:[]};
    L(s,'Nhận cọc '+vnd(depOf(o.cams))+', ghi nhận tình trạng máy khi giao');L(s,'Giao máy cho khách');
  }
  if(o.stage>=4){o.returnRec={at:new Date(e),by,missing:[],note:''};L(e,'Nhận máy trả')}
  if(o.after){o.condAfter={desc:'Máy nguyên vẹn như lúc giao, đủ phụ kiện.',result:'ok',missing:[],lateMin:0,lateFee:0,sched:0,dmg:0,repDays:0,repFee:0,total:0,by,at:new Date(e+36e5),photos:[]};o.deduct=0;L(e+36e5,'Ghi nhận tình trạng máy khi trả: nguyên vẹn')}
  if(o.refunded){Object.assign(o.deposit,{status:'refunded',refund:o.deposit.amount,refundAt:new Date(e+2*36e5),refundBy:by,refundNote:''});L(e+2*36e5,'Hoàn cọc '+vnd(o.deposit.amount))}
  if(o.stage>=5)L(e+3*36e5,'Hoàn tất đơn');
  delete o.after;delete o.refunded;
  return o;
}

/* ---------- calendar ---------- */
function calendar(ids,sel,p){
  const m0=new Date(today.getFullYear(),today.getMonth()+S.ui.cal,1);
  const first=(m0.getDay()+6)%7,days=new Date(m0.getFullYear(),m0.getMonth()+1,0).getDate();
  const bk=new Set();ids.forEach(id=>busyOf(id).forEach(x=>bk.add(x)));
  const end=sel?iso(addD(pISO(sel),span(p))):'';
  let cells='';for(let i=0;i<first;i++)cells+='<span></span>';
  for(let d=1;d<=days;d++){
    const dd=new Date(m0.getFullYear(),m0.getMonth(),d),k=iso(dd),past=dd<today,b=bk.has(k);
    const cl=[b?'bk':'',k===iso(today)?'td':'',sel&&k===sel?'st':'',sel&&k>sel&&k<=end?'rg':''].join(' ');
    cells+=`<button class="day ${cl}" data-act="pickday" data-d="${k}" ${past||b?'disabled':''} aria-label="${d}/${m0.getMonth()+1}${b?', đã có người đặt':''}" ${k===sel?'aria-pressed="true"':''}>${d}</button>`;
  }
  return `<div class="cal"><div class="cal-h"><button class="ibtn" data-act="calp" aria-label="Tháng trước" ${S.ui.cal<=0?'disabled style="opacity:.3"':''}>${ic('chevl')}</button><span>Tháng ${m0.getMonth()+1}, ${m0.getFullYear()}</span><button class="ibtn" data-act="caln" aria-label="Tháng sau" ${S.ui.cal>=2?'disabled style="opacity:.3"':''}>${ic('chevr')}</button></div>
  <div class="cal-g">${['T2','T3','T4','T5','T6','T7','CN'].map(w=>`<span class="w">${w}</span>`).join('')}${cells}</div>
  <div class="legend"><span><i style="background:var(--pri)"></i>Ngày nhận</span><span><i style="background:var(--acc)"></i>Thời gian thuê</span><span><i style="background:repeating-linear-gradient(135deg,transparent 0 3px,var(--line) 3px 4px);border:1px solid var(--line)"></i>Đã có người đặt</span></div></div>`;
}
function availMsg(ids,date,p){

  if(free(ids,date,p))return `<div class="note ok">${ic('check')}<span>Còn máy trong thời gian này.</span></div>`;

}

function catList(){
  const f=S.ui.cat;
  let l=VIS().filter(c=>(!f.brand||c.brand===f.brand)&&(!f.type||c.cat===f.type)&&c.p[1]<=f.max&&(!f.ok||rentable(c))&&(!f.q||c.name.toLowerCase().replace(/[-\s]/g,'').includes(f.q.toLowerCase().replace(/[-\s]/g,''))));
  if(f.sort==='asc')l=[...l].sort((a,b)=>a.p[1]-b.p[1]);if(f.sort==='desc')l=[...l].sort((a,b)=>b.p[1]-a.p[1]);
  const g=$('#cat-grid');if(!g)return;$('#cat-n').textContent=`${l.length} máy`;

  <div class="two" style="margin:28px 0;align-items:start"><div><div class="score"><span class="n">${a.toFixed(1)}</span><div>${stars(a)}<div class="muted sm-t">${pubRv().length} đánh giá</div></div></div>${distrib()}</div>
  <div><h3>Điểm theo tiêu chí</h3><div class="bars">${crit.map(([n,v])=>`<div style="display:grid;grid-template-columns:130px 1fr 32px;gap:8px;align-items:center"><span>${n}</span><i><b style="width:${v/5*100}%"></b></i><b>${v}</b></div>`).join('')}</div><p class="muted sm-t" style="margin-top:8px">Điểm tiêu chí là số liệu mẫu.</p><button class="btn btn-pri" style="margin-top:14px" data-act="writerv">Viết đánh giá</button></div></div>

  <div class="field" style="flex-direction:row;align-items:center"><label for="rv-s">Sắp xếp</label><select id="rv-s" data-rvs style="width:auto"><option value="new" ${f.sort==='new'?'selected':''}>Mới nhất</option><option value="help" ${f.sort==='help'?'selected':''}>Hữu ích nhất</option><option value="high" ${f.sort==='high'?'selected':''}>Điểm cao đến thấp</option><option value="low" ${f.sort==='low'?'selected':''}>Điểm thấp đến cao</option></select></div></div>
  ${l.length?`<div class="masonry">${l.map(r=>reviewCard(r)).join('')}</div>`:`<div class="empty">${ic('cam')}<h3>Chưa có đánh giá phù hợp</h3><p class="muted">Thử chọn bộ lọc khác.</p><button class="btn btn-out" data-act="rvf" data-f="all">Xem tất cả</button></div>`}</div></section>`;
};

/* booking */
const SHEAD=['Chọn máy','Thời gian','Thông tin & cọc','Xác nhận'];
function stepper(s){return `<ol class="steps" aria-label="Các bước đặt lịch">${SHEAD.map((t,i)=>`<li class="${i+1<s?'done':i+1===s?'cur':''}" ${i+1===s?'aria-current="step"':''}><span class="c">${i+1<s?ic('check'):i+1}</span><span>${t}</span></li>`).join('')}</ol>`}
function summary(b){
  const tm=timing(b),gross=sumP(b.cams,b.pkg),disc=bDisc(b),tot=gross-disc;
  return `<aside class="panel sum" aria-label="Tóm tắt đơn"><h3 style="margin:0">Tóm tắt đơn</h3>${b.cams.length?b.cams.map(id=>{const c=CAM(id);return `<div class="pick" style="cursor:default"><span class="th">${camPic(c)}</span><span><b>${esc(c.name)}</b><small>${PKG[b.pkg].n} · ${vnd(c.p[b.pkg])}</small></span></div>`}).join(''):`<p class="muted" style="margin:0">Chưa chọn máy.</p>`}
  <ul class="kv"><li><span>Nhận</span><b>${tm?dt(tm.s):'Chưa chọn'}</b></li><li><span>Trả trước</span><b>${tm?dt(tm.e):'Chưa chọn'}</b></li><li><span>Hình thức</span><b>${b.method==='direct'?'Đến lấy tại cửa hàng':'Giao/ship'}</b></li><li><span>Tiền thuê</span><b>${vnd(gross)}</b></li>${disc?`<li><span>Khuyến mãi ${esc(b.promo.code)}</span><b>-${vnd(disc)}</b></li><li><span>Sau khuyến mãi</span><b>${vnd(tot)}</b></li>`:''}<li><span>Giữ slot (trừ vào tiền thuê)</span><b>${vnd(SLOT())}</b></li><li><span>Cọc khi nhận</span><b>${b.cams.length?vnd(depOf(b.cams)):'-'}</b></li></ul></aside>`;
}
function bookStep(b){
  const e=b.err||{};const f=(k,l,ph,t='text',ex='')=>`<div class="field ${e[k]?'bad':''}"><label for="b-${k}">${l}</label><input id="b-${k}" type="${t}" data-bind="b.${k}" value="${esc(b[k])}" placeholder="${ph}" ${ex}>${e[k]?`<span class="errt" role="alert">${ic('alert')}${e[k]}</span>`:''}</div>`;
  if(b.step===1)return `<div class="panel"><div><h2 style="font-size:26px">Chọn máy</h2><p class="muted" style="margin:0">Bạn có thể chọn nhiều máy trong cùng một đơn.</p></div>
   <div style="display:grid;gap:10px">${VIS().map(c=>{const on=b.cams.includes(c.id),out=!rentable(c);return `<button class="pick ${on?'on':''} ${out?'off':''}" data-act="bcam" data-id="${c.id}" ${out?'disabled':''} aria-pressed="${on}"><span class="th">${camPic(c)}</span><span><b>${esc(c.name)}</b><small>${K(c.p[b.pkg])} · ${PKG[b.pkg].n}${out?' · '+STT[c.st][0]:''}</small></span><span class="tk">${on?ic('check'):''}</span></button>`}).join('')}</div>
   ${e.cams?`<span class="errt" role="alert">${ic('alert')}${e.cams}</span>`:''}<div class="nav-btns"><a class="btn btn-ghost" href="#/may">Xem danh mục</a><button class="btn btn-pri" data-act="bnext">Tiếp tục</button></div></div>`;
  if(b.step===2){
    const tm=timing(b);
    return `<div class="panel"><h2 style="font-size:26px">Chọn thời gian</h2>
    <div><div class="lbl" style="margin-bottom:8px">Gói thuê</div><div class="pkpick">${PKG.map((x,i)=>`<button class="${b.pkg===i?'on':''}" data-act="bpk" data-p="${i}" aria-pressed="${b.pkg===i}" ${pkgOn(i)?'':'disabled style="opacity:.45"'}><b>${x.n}</b><small>${pkgOn(i)?x.sub:'Tạm ngưng'}</small></button>`).join('')}</div>${e.pkg?`<span class="errt" role="alert">${ic('alert')}${e.pkg}</span>`:''}</div>
    <div><div class="lbl" style="margin-bottom:8px">Ngày nhận</div>${calendar(b.cams,b.date,b.pkg)}${e.date?`<span class="errt" role="alert">${ic('alert')}${e.date}</span>`:''}<div style="margin-top:10px">${availMsg(b.cams,b.date,b.pkg)}</div></div>
    ${b.pkg===0?`<div class="field"><label for="b-ca">Ca thuê</label><select id="b-ca" data-bind="b.ca" data-re="1"><option value="sang" ${b.ca==='sang'?'selected':''}>Ca sáng: 8h đến 14h</option><option value="chieu" ${b.ca==='chieu'?'selected':''}>Ca chiều tối: 15h đến 21h</option></select><span class="help">Có thể linh động giờ nếu còn trống, hãy nhắn cửa hàng.</span></div>`
    :`<div class="field"><label for="b-time">Giờ nhận máy</label><select id="b-time" data-bind="b.time" data-re="1">${Array.from({length:13},(_,i)=>`${pad(i+8)}:00`).map(t=>`<option ${b.time===t?'selected':''}>${t}</option>`).join('')}</select>${tm?`<span class="help">Trả máy trước <b>${dt(tm.e)}</b> (tính ${24*b.pkg-1} giờ).</span>`:''}</div>`}
    <div><div class="lbl" style="margin-bottom:8px">Hình thức nhận máy</div><div style="display:grid;gap:10px">
     <label class="radio ${b.method==='direct'?'on':''}"><input type="radio" name="bm" data-bind="b.method" data-re="1" value="direct" ${b.method==='direct'?'checked':''}><span><b>Đến lấy tại cửa hàng</b><span class="muted sm-t">Cọc 700.000đ hoặc 300.000đ (máy compact) kèm CCCD</span></span></label>
     <label class="radio ${b.method==='ship'?'on':''}"><input type="radio" name="bm" data-bind="b.method" data-re="1" value="ship" ${b.method==='ship'?'checked':''}><span><b>Giao hoặc ship</b><span class="muted sm-t">Cọc online, phí giao nhận tính riêng</span></span></label></div></div>
    ${b.method==='direct'?`<div class="note info">${ic('map')}<span>Nhận máy tại cửa hàng: 75 Lê Thị Hồng Gấm, Hải Châu, Đà Nẵng.</span></div>`:`<div class="note warn">${ic('alert')}<span>Mất phụ kiện hoặc hỏng máy do shipper, cửa hàng không chịu trách nhiệm.</span></div>${f('addr','Địa chỉ nhận máy','Số nhà, đường, quận','text')}`}
    <div class="nav-btns"><button class="btn btn-out" data-act="bback">Quay lại</button><button class="btn btn-pri" data-act="bnext">Tiếp tục</button></div></div>`;
  }
  if(b.step===3){
    const dep=depOf(b.cams),online=b.dep==='online'||b.method==='ship';
    return `<div class="panel"><h2 style="font-size:26px">Thông tin và tiền cọc</h2>
    <div class="row2">${f('name','Họ và tên','Nguyễn Văn A')}${f('phone','Số điện thoại','0912345678','tel','inputmode="numeric" autocomplete="tel"')}</div>
    <div class="row2">${f('fb','Facebook hoặc Zalo chính chủ','Đường dẫn hoặc tên tài khoản')}<div class="field ${e.who?'bad':''}"><label for="b-who">Đối tượng</label><select id="b-who" data-bind="b.who"><option value="">Chọn đối tượng</option><option ${b.who==='Học sinh / Sinh viên'?'selected':''}>Học sinh / Sinh viên</option><option ${b.who==='Đã đi làm'?'selected':''}>Đã đi làm</option></select>${e.who?`<span class="errt" role="alert">${ic('alert')}${e.who}</span>`:''}</div></div>
    <div><div class="lbl" style="margin-bottom:8px">Hình thức cọc</div><div style="display:grid;gap:10px">
     ${b.method==='direct'?`<label class="radio ${b.dep==='direct'?'on':''}"><input type="radio" name="bd" data-bind="b.dep" data-re="1" value="direct" ${b.dep==='direct'?'checked':''}><span><b>Cọc trực tiếp khi nhận máy</b><span class="muted sm-t">${vnd(dep)} + CCCD chính chủ, hoặc cọc tài sản trên 15 triệu + CCCD</span></span></label>`:''}
     <label class="radio ${online?'on':''}"><input type="radio" name="bd" data-bind="b.dep" data-re="1" value="online" ${online?'checked':''} ${b.method==='ship'?'disabled':''}><span><b>Cọc online (chuyển khoản)</b><span class="muted sm-t">Chuyển đủ ${vnd(dep)}, gửi ảnh CCCD, SĐT và Facebook chính chủ</span></span></label></div></div>
    <div class="note info">${ic('info')}<span><b>CCCD phải là của chính chủ người thuê.</b> Cửa hàng không nhận hình thức cọc nào khác.</span></div>
    ${online?`<div class="row2"><label class="upl ${b.idf?'ok':''}"><input type="file" accept="image/*" data-file="idf">${b.idf?ic('check')+' '+esc(b.idf):ic('upload')+'<br>Ảnh CCCD mặt VNeID'}</label><label class="upl ${b.idb?'ok':''}"><input type="file" accept="image/*" data-file="idb">${b.idb?ic('check')+' '+esc(b.idb):ic('upload')+'<br>Ảnh CCCD mặt thẻ'}</label></div>${e.id?`<span class="errt" role="alert">${ic('alert')}${e.id}</span>`:''}`:''}
    <div class="stamp"><div class="stamp-in" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg class="qr" viewBox="0 0 21 21" aria-label="Mã QR chuyển khoản mẫu">${Array.from({length:441},(_,i)=>{const x=i%21,y=(i/21)|0;const fin=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);const on=fin?(x%6===0||y%6===0||x%14===0&&0||((x<7||x>13)&&(y<7||y>13)&&(x%6===0||y%6===0||(x%6>1&&x%6<5&&y%6>1&&y%6<5)))): hash('q'+i)%3===0;return on?`<rect x="${x}" y="${y}" width="1" height="1" fill="#2B1A12"/>`:''}).join('')}</svg>
     <div style="flex:1;min-width:200px;display:grid;gap:8px"><h3 style="margin:0;font-size:18px">Thanh toán giữ slot: 50.000đ</h3><p class="muted sm-t" style="margin:0">Khoản này được trừ vào tiền thuê. Quét mã hoặc chuyển khoản theo thông tin mẫu bên dưới.</p><div class="copy"><span>Nội dung: <b>MEE ${esc(b.phone||'SĐT')}</b></span><button class="btn btn-ghost sm" data-act="copy" data-v="MEE ${esc(b.phone)}" aria-label="Sao chép nội dung chuyển khoản">${ic('copy')}</button></div></div></div></div>
    <div class="field ${e.note?'bad':''}"><label for="b-note">Ghi chú cho cửa hàng (không bắt buộc)</label><textarea id="b-note" data-bind="b.note" maxlength="300" placeholder="Ví dụ: cần nhận máy sớm, cần thêm thẻ nhớ...">${esc(b.note)}</textarea>${e.note?`<span class="errt" role="alert">${ic('alert')}${e.note}</span>`:''}</div>
    <div class="field"><label for="b-pcode">Mã khuyến mãi (nếu có)</label><div style="display:flex;gap:8px"><input id="b-pcode" type="text" data-bind="b.pcode" value="${esc(b.pcode)}" placeholder="Ví dụ: MEE10" style="text-transform:uppercase"><button class="btn btn-out" type="button" data-act="papply">Áp dụng</button>${b.promo?`<button class="btn btn-ghost" type="button" data-act="pclear">Bỏ mã</button>`:''}</div>${b.promo?`<span class="help" style="color:var(--ok)">Đã áp dụng ${esc(b.promo.code)}: giảm ${vnd(bDisc(b))}</span>`:''}${b.perr?`<span class="errt" role="alert">${ic('alert')}${b.perr}</span>`:''}</div>
    <div class="nav-btns"><button class="btn btn-out" data-act="bback">Quay lại</button><button class="btn btn-pri" data-act="bnext">Tiếp tục</button></div></div>`;
  }
  const tm=timing(b);
  return `<div class="panel"><h2 style="font-size:26px">Xác nhận đặt lịch</h2>
   <ul class="kv"><li><span>Máy</span><b>${b.cams.map(id=>esc(CAM(id).name)).join(', ')}</b></li><li><span>Gói</span><b>${PKG[b.pkg].n}</b></li><li><span>Nhận</span><b>${tm?dt(tm.s):''}</b></li><li><span>Trả trước</span><b>${tm?dt(tm.e):''}</b></li><li><span>Người thuê</span><b>${esc(b.name)} · ${esc(b.phone)}</b></li><li><span>Tiền thuê</span><b>${vnd(sumP(b.cams,b.pkg))}</b></li>${bDisc(b)?`<li><span>Khuyến mãi ${esc(b.promo.code)}</span><b>-${vnd(bDisc(b))}</b></li>`:''}<li><span>Cọc</span><b>${vnd(depOf(b.cams))} (${b.method==='ship'||b.dep==='online'?'online':'trực tiếp'})</b></li>${b.note?`<li><span>Ghi chú</span><b>${esc(b.note)}</b></li>`:''}</ul>
   <div style="display:grid;gap:12px"><div class="lbl">Quy định cần đồng ý</div>
    <label class="chk ${e.a1?'bad':''}"><input type="checkbox" data-bind="b.a1" ${b.a1?'checked':''}><span>Tôi đã đọc quy định <a href="#/chinh-sach/coc" target="_blank" rel="noopener">tiền cọc</a> và <a href="#/chinh-sach/nhan-tra" target="_blank" rel="noopener">nhận, trả máy</a>.</span></label>
    <label class="chk ${e.a2?'bad':''}"><input type="checkbox" data-bind="b.a2" ${b.a2?'checked':''}><span>Tôi đồng ý <a href="#/chinh-sach/den-bu" target="_blank" rel="noopener">quy định đền bù thiệt hại</a>.</span></label>
    <label class="chk ${e.a3?'bad':''}" style="background:var(--errbg);padding:12px;border-radius:12px"><input type="checkbox" data-bind="b.a3" ${b.a3?'checked':''}><span><b>Tôi hiểu cửa hàng không nhận hủy lịch trong bất kỳ trường hợp nào</b> và 50K giữ slot không hoàn lại.</span></label>
    ${(e.a1||e.a2||e.a3)?`<span class="errt" role="alert">${ic('alert')}Bạn cần đồng ý cả ba mục để tiếp tục.</span>`:''}</div>
   <div class="nav-btns"><button class="btn btn-out" data-act="bback">Quay lại</button><button class="btn btn-pri lg" data-act="bsubmit">Xác nhận đặt lịch</button></div></div>`;
}
P.book=()=>{
  const b=S.b;if(b.step>=3&&!S.user)b.step=2;else if(b.step>=3){if(!b.name)b.name=S.user.name;if(!b.phone)b.phone=S.user.phone}
  return `<section class="sec" style="padding-top:36px"><div class="wrap"><h1 style="font-size:clamp(30px,4vw,46px)">Đặt lịch thuê máy</h1>${stepper(b.step)}<div class="book"><div>${bookStep(b)}</div>${summary(b)}</div></div></section>`;
};
P.done=()=>{
  const o=S.done;if(!o)return `<section class="sec"><div class="wrap"><div class="empty"><h3>Chưa có đơn nào vừa đặt</h3><a class="btn btn-pri" href="#/dat-lich">Đặt máy</a></div></div></section>`;
  return `<section class="sec"><div class="wrap" style="max-width:720px;text-align:center"><div style="width:84px;height:84px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;margin:0 auto 16px">${ic('check').replace('<svg','<svg width="44" height="44"')}</div><h1 style="font-size:clamp(28px,4vw,42px)">Đã giữ máy cho bạn</h1><p class="lead" style="margin:0 auto 28px">Mã đơn <b>${o.id}</b>. Cửa hàng sẽ liên hệ qua Zalo để xác nhận giữ slot.</p>
  <div class="stamp" style="text-align:left"><div class="stamp-in"><ul class="kv"><li><span>Máy</span><b>${o.cams.map(id=>esc(CAM(id).name)).join(', ')}</b></li><li><span>Nhận</span><b>${dt(o.start)}</b></li><li><span>Trả trước</span><b>${dt(o.end)}</b></li><li><span>Trạng thái</span><b><span class="badge b-low">Chờ xử lý</span></b></li></ul>
  <h3 style="margin:22px 0 10px">Việc tiếp theo</h3><ol class="lines"><li>Cửa hàng xác nhận giữ slot qua Zalo.</li><li>Mang CCCD chính chủ và tiền cọc khi nhận máy.</li><li>Kiểm tra máy cùng cửa hàng trước khi nhận.</li></ol></div></div>
  <div class="cta" style="justify-content:center"><a class="btn btn-pri" href="${S.user?'#/tai-khoan/don':'#/dang-nhap'}">${S.user?'Xem đơn của tôi':'Đăng nhập để theo dõi đơn'}</a><a class="btn btn-out" href="#/lien-he">Nhắn Zalo cửa hàng</a></div></div></section>`;
};

function lateMin(o){const t=o.returnRec?+o.returnRec.at:Date.now();return Math.max(0,Math.round((t-+o.end)/6e4))}

  $('#c-sum').innerHTML=`<li><span>Tiền cọc đã nhận</span><b>${vnd(dep)}</b></li><li><span>Trả trễ ${lm} phút</span><b>${vnd(lf+sc)}</b></li><li><span>Đền bù thiết bị</span><b>${vnd(dmg)}</b></li><li><span>Phí máy nằm sửa</span><b>${vnd(rf)}</b></li><li><span>Tổng khấu trừ</span><b>${vnd(tot)}</b></li><li><span>${tot>dep?'Khách cần bù thêm':'Dự kiến hoàn lại'}</span><b style="color:var(--pri)">${vnd(Math.abs(dep-tot))}</b></li>`;

}

/* ---------- router ---------- */
const app=$('#app');
function route(){
  const p=(location.hash.slice(1).split('?')[0])||'/';let m;
  if(p==='/')return[P.home(),'me.e_digitalcam · Thuê máy ảnh Đà Nẵng'];
  if(p==='/may')return[P.catalog(),'Máy cho thuê'];
  if(m=p.match(/^\/may\/([\w-]+)$/)){const c=CAM(m[1]);return[P.detail(m[1]),c?c.name:'Không tìm thấy']}
  if(p==='/gia')return[P.price(),'Gói thuê và bảng giá'];
  if(p==='/quy-trinh')return[P.process(),'Quy trình thuê'];
  if(m=p.match(/^\/chinh-sach\/?([\w-]*)$/))return[P.policy(m[1]),'Chính sách'];
  if(p==='/danh-gia')return[P.reviews(),'Đánh giá và phản hồi'];
  if(p==='/dat-lich')return[P.book(),'Đặt lịch'];
  if(p==='/dat-lich/thanh-cong')return[P.done(),'Đã giữ máy'];
  if(p==='/dang-nhap')return[P.login(),'Đăng nhập'];
  if(m=p.match(/^\/tai-khoan\/don\/([\w-]+)$/))return[P.order(m[1]),'Chi tiết đơn'];
  if(m=p.match(/^\/tai-khoan\/?([\w-]*)$/))return[P.account(m[1]),'Tài khoản'];
  if(p==='/lien-he')return[P.contact(),'Liên hệ'];
  if(p.startsWith('/quan-tri'))return[A.page(p),'Quản trị'];
  return[P.nf(),'Không tìm thấy'];
}
function render(top=true){
  const p=location.hash.slice(1).split('?')[0]||'/';
  norm();const[html,title]=route();document.title=title+(title.includes('digitalcam')?'':' · '+BRAND);
  app.innerHTML=p.startsWith('/quan-tri')?`<main id="main" tabindex="-1">${html}</main>`:header(p)+`<main id="main" tabindex="-1">${html}</main>${footer()}`;
  if(top){window.scrollTo(0,0)}
  if($('#cat-grid'))catList();
  tick();
}

    el.classList.toggle('warn',ms>=0&&ms<2*36e5);el.classList.toggle('late',ms<0)});
}

function validate(b){
  const e={};

  if(b.step===2){
    if(b.cams.some(id=>!rentable(CAM(id))))e.cams='Có máy không còn khả dụng.';
    if(!pkgOn(b.pkg))e.pkg='Gói thuê này đang tạm ngưng. Hãy chọn gói khác.';
    if(!b.date)e.date='Chọn ngày nhận máy trên lịch.';
    else if(pISO(b.date)<today)e.date='Ngày nhận không được ở quá khứ.';
    else if(!free(b.cams,b.date,b.pkg))e.date='Máy đã có người đặt trong thời gian này. Hãy chọn ngày khác.';
    if(b.method==='ship'&&!b.addr.trim())e.addr='Nhập địa chỉ nhận máy.';
  }
  if(b.step===3){
    if(b.name.trim().length<2)e.name='Nhập họ và tên.';
    if(!/^0\d{9}$/.test(b.phone.replace(/\s/g,'')))e.phone='Số điện thoại gồm 10 số, bắt đầu bằng 0.';
    if(!b.who)e.who='Chọn đối tượng.';
    const online=b.dep==='online'||b.method==='ship';
    if(online){if(!b.fb.trim())e.fb='Thuê online cần Facebook hoặc Zalo chính chủ.';if(!b.idf||!b.idb)e.id='Cần tải đủ ảnh CCCD hai mặt.'}
    if(b.note.length>300)e.note='Ghi chú tối đa 300 ký tự.';
  }
  if(b.step===4){['a1','a2','a3'].forEach(k=>{if(!b[k])e[k]=1})}
  return e;
}

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.bind&&(t.type==='radio'||t.tagName==='SELECT'||t.type==='checkbox')){setPath(t.dataset.bind,t.type==='checkbox'?t.checked:t.value);if(t.dataset.bind==='b.method'&&t.value==='ship')S.b.dep='online';if(t.dataset.re)refresh();return}
  if(t.dataset.f){const f=S.ui.cat;f[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;catList()}
  if(t.dataset.calc){S.ui.calc[t.dataset.calc]=t.dataset.calc==='pkg'?+t.value:t.value;refresh()}
  if(t.dataset.rvs!==undefined){S.ui.rv.sort=t.value;refresh()}
  if(t.dataset.rvo!==undefined){S.rvForm.order=t.value}
  if(t.dataset.chk!==undefined){S.ui.chk[t.dataset.chk]=t.checked}
  if(t.dataset.file){
    const fl=[...t.files];if(!fl.length)return;const k=t.dataset.file;
    if(k==='idf'||k==='idb'||k==='verify'){
      const f=fl[0];
      if(!IMG_OK.includes(f.type)){toast('Ảnh CCCD phải là JPG, PNG hoặc WEBP.','err');t.value='';return}
      if(f.size>5*1048576){toast('Ảnh CCCD vượt quá 5MB.','err');t.value='';return}
      if(k==='verify'){S.user.verify=1;toast('Đã gửi ảnh CCCD, đang chờ duyệt','ok')}else S.b[k]=f.name;
      refresh();
    } else if(k==='rvph'){
      readImgs(fl,{max:3,mb:3,have:S.rvForm.photos.length},list=>{S.rvForm.photos.push(...list.map(x=>x.url));drawRvPv()});t.value='';
    }
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(['l-ph','l-pw','l-name','l-em'].includes(e.target.id)){e.preventDefault();const b=$('[data-act="login"]');b&&b.click()}
  if(['a-u','a-p'].includes(e.target.id)){e.preventDefault();const b=$('[data-ad="login"]');b&&b.click()}
});


render(false);
})();
</script>
<script>
document.addEventListener('submit',function(e){var f=e.target;if(!f.hasAttribute||!f.hasAttribute('data-pxs'))return;e.preventDefault();
var v=(document.getElementById('px-q').value||'').trim();location.hash='#/may';
setTimeout(function(){var i=document.getElementById('f-q');if(i){i.value=v;i.dispatchEvent(new Event('input',{bubbles:true}))}},80)});
</script>
